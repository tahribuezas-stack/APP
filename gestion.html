<script>
(function () {
  try {
    var a = localStorage.getItem('kinet_custom_accent_override') || localStorage.getItem('kinet_accent_color');
    var rb = localStorage.getItem('kinet_rainbow_mode') === 'true';
    if (a && a.charAt(0) === '#' && !rb) {
      var n = parseInt(a.slice(1), 16);
      if (!isNaN(n)) {
        var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255, st = document.createElement('style');
        st.textContent = ':root,html,body,body[data-role]{--role-color:' + a + ' !important;--role-rgb:' + r + ',' + g + ',' + b + ' !important;--role-glow:rgba(' + r + ',' + g + ',' + b + ',0.42) !important;--role-gradient:linear-gradient(135deg,' + a + ' 0%,rgba(' + r + ',' + g + ',' + b + ',0.75) 100%) !important}';
        document.head.appendChild(st);
      }
    }
  } catch (e) {}
})();
</script>

<style>

.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>.field{flex:1 1 160px}

/* ── Movimiento del panel de gestión ── */
#gnav{position:relative}
.kg-ind{position:absolute;left:0;top:0;width:3px;border-radius:0 4px 4px 0;background:var(--role-color);box-shadow:0 0 16px var(--role-color),0 0 4px var(--role-color);transition:translate .55s cubic-bezier(.2,.9,.2,1.05),height .4s cubic-bezier(.16,1,.3,1),opacity .3s;pointer-events:none;z-index:3}

.panel{transition:border-color .25s,box-shadow .35s,translate .45s cubic-bezier(.16,1,.3,1)}
.panel:hover{translate:0 -2px;box-shadow:0 20px 44px rgba(0,0,0,.62),0 0 28px rgba(var(--role-rgb),.14),inset 0 1px 0 rgba(255,255,255,.08)}
.kpi{transition:translate .4s cubic-bezier(.16,1,.3,1),border-color .25s}

.kpi.click:active,.btn:active{scale:.97}
.btn{position:relative;overflow:hidden;transition:background .2s,border-color .2s,color .2s,box-shadow .25s,translate .25s cubic-bezier(.16,1,.3,1),scale .2s}

.kg-rip{position:absolute;border-radius:50%;background:rgba(var(--role-rgb),.35);pointer-events:none;transform:scale(0);animation:kgRip .6s cubic-bezier(.16,1,.3,1) forwards}

.modal{transition:opacity .3s,transform .45s cubic-bezier(.16,1,.3,1)}

.bar-h .fi{transition:width 1.2s cubic-bezier(.16,1,.3,1)}

.kg-grp{font:700 .56rem 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--text-secondary);opacity:.55;padding:12px 8px 3px}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:9500;overflow:hidden}.confetti span{position:absolute;top:55%;animation:conf 1.5s cubic-bezier(.16,.8,.3,1) forwards}

<script>
/* Gestión: ningún campo debe parecer un formulario de acceso (evita que iOS ofrezca «Iniciar sesión» / contraseñas guardadas) */
(function(){
  function fix(el){
    if(!el||el.__kgFixed||!/^(INPUT|TEXTAREA)$/.test(el.tagName))return; el.__kgFixed=1;
    var t=(el.getAttribute('type')||'text').toLowerCase(); if(/^(checkbox|radio|button|submit|range|color|file)$/.test(t))return;
    if(t==='password'||t==='email'){try{el.setAttribute('type','text');}catch(e){}}
    el.setAttribute('autocomplete','off'); el.setAttribute('autocorrect','off'); el.setAttribute('autocapitalize','off'); el.setAttribute('spellcheck','false');
    el.setAttribute('data-lpignore','true'); el.setAttribute('data-1p-ignore',''); el.setAttribute('data-form-type','other');
    var n=(el.getAttribute('name')||''); if(!n||/mail|user|login|pass|usuario|correo/i.test(n)) el.setAttribute('name','kg-'+(el.id||Math.random().toString(36).slice(2,7)));
  }
  function scan(r){ (r||document).querySelectorAll('input,textarea').forEach(fix); }
  scan(); document.addEventListener('DOMContentLoaded',function(){ scan(); try{ new MutationObserver(function(ms){ ms.forEach(function(m){ m.addedNodes.forEach(function(n){ if(n.nodeType===1){ fix(n); scan(n); } }); }); }).observe(document.body,{childList:true,subtree:true}); }catch(e){} });
})();
</script>
