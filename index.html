<!-- SCRIPTS DE NAVEGACIÓN Y TRANSICIONES CON DESPLAZAMIENTO FLUIDO (SMOOTH EASE-IN-OUT) -->
  <script>
    lucide.createIcons();

    // Sincroniza la opacidad al navegar o regresar de página
    window.addEventListener('pageshow', function(event) {
      document.body.style.opacity = '1';
      const caja = document.querySelector('.main-box');
      if (caja) caja.classList.remove('page-exit');
    });

    document.addEventListener("DOMContentLoaded", function() {
      document.body.style.opacity = '1';
    });

    // 1. DESPLAZAMIENTO FLUIDO HASTA ARRIBA (AL PULSAR EL LOGO)
    function scrollToTop() {
      const startPosition = window.pageYOffset;
      let startTime = null;
      const duration = 750; // 750ms de deslizamiento suave

      function animation(currentTime) {
        if (startTime === null) startTime = currentTime;
        const timeElapsed = currentTime - startTime;
        const run = easeInOutQuad(timeElapsed, startPosition, -startPosition, duration);
        window.scrollTo(0, run);
        if (timeElapsed < duration) {
          requestAnimationFrame(animation);
        }
      }

      function easeInOutQuad(t, b, c, d) {
        t /= d / 2;
        if (t < 1) return c / 2 * t * t + b;
        t--;
        return -c / 2 * (t * (t - 2) - 1) + b;
      }

      requestAnimationFrame(animation);
    }

    // 2. DESPLAZAMIENTO FLUIDO A SECCIONES ESPECÍFICAS (CON COMPENSACIÓN DE HEADER)
    function scrollToSection(sectionId) {
      const element = document.getElementById(sectionId);
      if (element) {
        const headerOffset = 95; // Compensación de la barra flotante superior
        const elementPosition = element.getBoundingClientRect().top;
        const targetPosition = elementPosition + window.pageYOffset - headerOffset;
        const startPosition = window.pageYOffset;
        const distance = targetPosition - startPosition;
        let startTime = null;
        const duration = 750;

        function animation(currentTime) {
          if (startTime === null) startTime = currentTime;
          const timeElapsed = currentTime - startTime;
          const run = easeInOutQuad(timeElapsed, startPosition, distance, duration);
          window.scrollTo(0, run);
          if (timeElapsed < duration) {
            requestAnimationFrame(animation);
          }
        }

        function easeInOutQuad(t, b, c, d) {
          t /= d / 2;
          if (t < 1) return c / 2 * t * t + b;
          t--;
          return -c / 2 * (t * (t - 2) - 1) + b;
        }

        requestAnimationFrame(animation);
      }
    }

    // 3. TRANSICIÓN LÍQUIDA DE SALIDA ENTRE PÁGINAS (SIN CORTES BRUSCOS)
    function cambiarPagina(urlDestino) {
      const contenedor = document.querySelector('.main-box');
      if (contenedor) {
        contenedor.classList.add('page-exit');
      }
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = urlDestino;
      }, 500); // Sincronizado con kinet-motion.css
    }
  </script>
