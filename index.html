<!DOCTYPE html>
<html lang="es" class="h-full bg-[#080A0C]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINET OS - Secure Identity Gateway</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kinet: {
              neon: '#00FF66',
              titanium: '#0F1215',
              'titanium-light': '#181C22',
              'titanium-border': '#262D37',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .bg-cyber-pattern {
      background-color: #080A0C;
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.12) 0%, transparent 60%);
    }
    .glass-card {
      background: rgba(19, 23, 29, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .modal-backdrop {
      background: rgba(4, 6, 8, 0.85);
      backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-cyber-pattern text-slate-100 font-sans min-h-screen flex items-center justify-center p-3 md:p-6">

  <!-- CONTENEDOR MULTIDISPOSITIVO AJUSTADO -->
  <div class="relative w-full md:max-w-4xl max-h-[92vh] bg-[#0A0C0E] md:rounded-[28px] border border-kinet-titanium-border shadow-[0_0_50px_rgba(0,0,0,0.8)] flex flex-col md:flex-row overflow-hidden">
    
    <!-- PANEL IZQUIERDO: BRANDING & SECURITY INFO -->
    <div class="w-full md:w-5/12 bg-gradient-to-b from-[#11151B] to-[#0A0C0E] p-6 md:p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-800/80">
      
      <div class="space-y-4">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-kinet-neon to-emerald-600 font-display font-black text-black text-xl flex items-center justify-center shadow-[0_0_15px_rgba(0,255,102,0.4)]">
            K
          </div>
          <div>
            <h1 class="font-display font-black text-xl tracking-[0.2em] text-white leading-none">KINET</h1>
            <p class="text-[9px] text-kinet-neon font-mono tracking-widest uppercase mt-1">SPORTS TECH OS</p>
          </div>
        </div>

        <div class="hidden md:block pt-4 space-y-2">
          <h2 class="font-display font-bold text-base text-white">Identidad Digital Verificada</h2>
          <p class="text-[11px] text-slate-400 leading-relaxed">
            Accede a tu plataforma centralizada para gestionar tu rendimiento, métricas y perfil deportivo en la nube.
          </p>
        </div>
      </div>

      <!-- Badge de Estado de Seguridad -->
      <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center space-x-3">
        <i data-lucide="shield-check" class="w-4 h-4 text-kinet-neon shrink-0"></i>
        <div>
          <p class="text-[10px] font-bold text-slate-200">Protocolo OAuth 2.0</p>
          <p class="text-[8px] text-slate-400 font-mono">Conexión segura y encriptada</p>
        </div>
      </div>

    </div>

    <!-- PANEL DERECHO: FORMULARIO DE AUTENTICACIÓN DIRECTO -->
    <div class="w-full md:w-7/12 p-6 md:p-8 flex flex-col justify-between overflow-y-auto max-h-[85vh]">
      
      <div class="space-y-4">
        
        <!-- PESTAÑAS PRINCIPALES (LOGIN / REGISTRO) -->
        <div class="flex bg-[#12161C] p-1 rounded-xl border border-slate-800">
          <button id="tab-login" onclick="switchMainTab('login')" class="flex-1 py-2 rounded-lg text-xs font-display font-bold transition bg-kinet-neon text-black shadow-md">
            INICIAR SESIÓN
          </button>
          <button id="tab-register" onclick="switchMainTab('register')" class="flex-1 py-2 rounded-lg text-xs font-display font-bold transition text-slate-400 hover:text-white">
            CREAR CUENTA
          </button>
        </div>

        <!-- ACCESO RÁPIDO GOOGLE -->
        <button onclick="openGoogleSimModal()" class="w-full py-2.5 px-4 rounded-xl glass-card border-slate-700 hover:border-slate-500 transition flex items-center justify-center space-x-3 text-xs font-semibold text-white">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
            <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 17C3.7 20.7 7.5 24 12 24z"/>
          </svg>
          <span id="google-btn-label">Continuar con Google</span>
        </button>

        <div class="relative flex py-0.5 items-center">
          <div class="flex-grow border-t border-slate-800"></div>
          <span class="flex-shrink mx-4 text-[10px] font-mono text-slate-500 uppercase">O MÉTODO TRADICIONAL</span>
          <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- ================= FORMULARIO 1: INICIAR SESIÓN ================= -->
        <div id="container-login" class="space-y-3">
          <form onsubmit="handleLoginSubmit(event)" class="space-y-3">
            <div>
              <label class="text-[10px] font-mono text-slate-400 uppercase tracking-wider block mb-1">Email o Teléfono</label>
              <input type="text" id="login-email-input" required placeholder="usuario@kinet.com" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-kinet-neon transition">
            </div>

            <div>
              <label class="text-[10px] font-mono text-slate-400 uppercase tracking-wider block mb-1">Contraseña</label>
              <input type="password" required placeholder="••••••••••••" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-kinet-neon transition">
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-kinet-neon text-black font-display font-black text-xs tracking-wider uppercase hover:bg-emerald-400 transition shadow-[0_0_15px_rgba(0,255,102,0.2)]">
              INICIAR SESIÓN
            </button>
          </form>
        </div>

        <!-- ================= FORMULARIO 2: CREAR CUENTA NUEVA ================= -->
        <div id="container-register" class="space-y-3 hidden">
          <form onsubmit="handleRegisterSubmit(event)" class="space-y-3">
            <div>
              <label class="text-[10px] font-mono text-slate-400 uppercase tracking-wider block mb-1">Nombre de Usuario (@Username)</label>
              <input type="text" id="reg-username" required placeholder="tahribuezas" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-kinet-neon transition font-mono">
            </div>

            <div>
              <label class="text-[10px] font-mono text-slate-400 uppercase tracking-wider block mb-1">Correo Electrónico</label>
              <input type="email" required placeholder="correo@ejemplo.com" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-kinet-neon transition">
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-kinet-neon text-black font-display font-black text-xs tracking-wider uppercase hover:bg-emerald-400 transition shadow-[0_0_15px_rgba(0,255,102,0.2)]">
              CREAR CUENTA
            </button>
          </form>
        </div>

        <!-- MODO INVITADO RÁPIDO -->
        <div class="pt-1">
          <button onclick="goToGuest()" class="w-full glass-card p-2.5 rounded-xl border-slate-800 hover:border-slate-600 transition text-center flex items-center justify-center space-x-2">
            <i data-lucide="ghost" class="w-3.5 h-3.5 text-amber-400"></i>
            <span class="text-xs font-bold text-slate-300">Entrar como Invitado (Modo Rápido)</span>
          </button>
        </div>

      </div>

      <div class="pt-2 text-center">
        <p class="text-[9px] text-slate-500 font-mono">KINET OS • SECURE GATEWAY V2.8</p>
      </div>

    </div>

  </div>

  <!-- MODAL GOOGLE -->
  <div id="google-modal" class="fixed inset-0 modal-backdrop z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#181C24] w-full max-w-md p-6 rounded-2xl border border-slate-700 shadow-2xl relative space-y-4 text-center">
      <h3 class="font-bold text-sm text-white">Inicia sesión con Google</h3>
      <input type="email" id="google-email-input" placeholder="tu.nombre@gmail.com" class="w-full bg-[#12161C] border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-kinet-neon transition">
      <button onclick="confirmGoogleLogin()" class="w-full py-2.5 rounded-xl bg-kinet-neon text-black font-display font-bold text-xs uppercase hover:bg-emerald-400 transition">
        Continuar
      </button>
      <button onclick="closeGoogleSimModal()" class="text-xs text-slate-400 hover:text-white block mx-auto">Cancelar</button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function switchMainTab(tab) {
      const loginBox = document.getElementById('container-login');
      const registerBox = document.getElementById('container-register');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const googleLabel = document.getElementById('google-btn-label');

      if (tab === 'login') {
        loginBox.classList.remove('hidden');
        registerBox.classList.add('hidden');
        tabLogin.className = "flex-1 py-2 rounded-lg text-xs font-display font-bold transition bg-kinet-neon text-black shadow-md";
        tabRegister.className = "flex-1 py-2 rounded-lg text-xs font-display font-bold transition text-slate-400 hover:text-white";
        googleLabel.textContent = "Continuar con Google";
      } else {
        loginBox.classList.add('hidden');
        registerBox.classList.remove('hidden');
        tabRegister.className = "flex-1 py-2 rounded-lg text-xs font-display font-bold transition bg-kinet-neon text-black shadow-md";
        tabLogin.className = "flex-1 py-2 rounded-lg text-xs font-display font-bold transition text-slate-400 hover:text-white";
        googleLabel.textContent = "Registrarse con Google";
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const inputVal = document.getElementById('login-email-input').value;
      localStorage.setItem('kinet_mode', 'pro');
      localStorage.setItem('kinet_username', '@' + inputVal.split('@')[0]);
      window.location.href = 'fase1.html';
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const user = document.getElementById('reg-username').value;
      localStorage.setItem('kinet_mode', 'pro');
      localStorage.setItem('kinet_username', '@' + user);
      window.location.href = 'fase1.html';
    }

    function goToGuest() {
      const guestId = 'guest_' + Math.random().toString(36).substring(2, 8);
      localStorage.setItem('kinet_mode', 'guest');
      localStorage.setItem('kinet_username', guestId);
      window.location.href = 'fase1.html';
    }

    function openGoogleSimModal() {
      document.getElementById('google-modal').classList.remove('hidden');
    }

    function closeGoogleSimModal() {
      document.getElementById('google-modal').classList.add('hidden');
    }

    function confirmGoogleLogin() {
      const googleInput = document.getElementById('google-email-input').value;
      if (!googleInput) return;
      closeGoogleSimModal();
      localStorage.setItem('kinet_mode', 'pro');
      localStorage.setItem('kinet_username', '@' + googleInput.split('@')[0]);
      window.location.href = 'fase1.html';
    }
  </script>
</body>
</html>
