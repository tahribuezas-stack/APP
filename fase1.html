<!DOCTYPE html>
<html lang="es" class="h-full bg-[#080A0C]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINET OS - Precision Calibration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { kinet: { neon: '#00FF66', titanium: '#0F1215' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Orbitron', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .bg-cyber-pattern { background-color: #080A0C; background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.08) 0%, transparent 60%); }
    .glass-card { background: rgba(14, 18, 24, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.25s ease; }
    .glass-card.selected { border-color: #00FF66 !important; background: rgba(0, 255, 102, 0.03); }
  </style>
</head>
<body class="bg-cyber-pattern text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="relative w-full max-w-3xl bg-[#0B0E14] rounded-[24px] border border-slate-800 shadow-[0_0_50px_rgba(0,0,0,0.8)] p-6 md:p-8 space-y-6">
    <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-kinet-neon font-display font-black text-black text-lg flex items-center justify-center">K</div>
        <div>
          <h1 class="font-display font-black text-base tracking-[0.2em] text-white leading-none">KINET OS</h1>
          <p class="text-[8px] text-kinet-neon font-mono tracking-widest uppercase mt-1">PRECISION CALIBRATION</p>
        </div>
      </div>
      <button onclick="window.location.href='index.html'" class="bg-[#131720] hover:bg-slate-800 px-3 py-1 rounded-lg text-xs text-slate-300">Volver</button>
    </div>

    <div class="space-y-1">
      <h2 class="font-display font-bold text-xl text-white tracking-wide">1. SELECCIONA TU PERFIL</h2>
      <p class="text-xs text-slate-400">¿Cómo vas a interactuar con la plataforma KINET OS?</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div onclick="selectRole('athlete')" id="card-athlete" class="glass-card selected p-4 rounded-xl cursor-pointer space-y-3">
        <h3 class="font-display font-bold text-xs text-white">Atleta / Jugador</h3>
        <p class="text-[10px] text-slate-400">Seguimiento GRL, Staff AI y KINET Card.</p>
      </div>
      <div onclick="selectRole('coach')" id="card-coach" class="glass-card p-4 rounded-xl cursor-pointer space-y-3">
        <h3 class="font-display font-bold text-xs text-white">Entrenador / Staff</h3>
        <p class="text-[10px] text-slate-400">Control de plantilla y prevención.</p>
      </div>
      <div onclick="selectRole('scout')" id="card-scout" class="glass-card p-4 rounded-xl cursor-pointer space-y-3">
        <h3 class="font-display font-bold text-xs text-white">Club / Ojeador</h3>
        <p class="text-[10px] text-slate-400">Scouting analítico y fichajes.</p>
      </div>
    </div>

    <div>
      <button onclick="proceed()" class="w-full py-3.5 rounded-xl bg-kinet-neon text-black font-display font-black text-xs tracking-widest uppercase hover:bg-emerald-400 transition">
        CONTINUAR A DEPORTE / CONFIGURACIÓN
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let selectedRole = 'athlete';
    function selectRole(role) {
      selectedRole = role;
      document.getElementById('card-athlete').className = "glass-card p-4 rounded-xl cursor-pointer space-y-3";
      document.getElementById('card-coach').className = "glass-card p-4 rounded-xl cursor-pointer space-y-3";
      document.getElementById('card-scout').className = "glass-card p-4 rounded-xl cursor-pointer space-y-3";
      document.getElementById('card-' + role).className = "glass-card selected p-4 rounded-xl cursor-pointer space-y-3";
    }
    function proceed() {
      if (selectedRole === 'coach') {
        window.location.href = 'onboarding_coach_pro.html';
      } else if (selectedRole === 'scout') {
        window.location.href = 'onboarding_scout_pro.html';
      } else {
        window.location.href = 'onboarding_pro.html';
      }
    }
  </script>
</body>
</html>
