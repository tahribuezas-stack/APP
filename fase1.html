<!DOCTYPE html>
<html lang="es" class="h-full bg-[#080A0C]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINET OS - Selección de Rol</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kinet: {
              neon: '#00FF66',
              titanium: '#0F1215',
              'titanium-light': '#181C22',
              'titanium-border': '#262D37',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .bg-cyber-pattern {
      background-color: #080A0C;
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.12) 0%, transparent 60%);
    }
    .glass-card {
      background: rgba(19, 23, 29, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-cyber-pattern text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 md:p-8">

  <div class="relative w-full max-w-4xl bg-[#0A0C0E] rounded-[28px] border border-kinet-titanium-border shadow-[0_0_60px_rgba(0,0,0,0.9)] p-6 md:p-10 space-y-8">
    
    <!-- HEADER DE FASE 1 -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center space-x-2 bg-kinet-neon/10 border border-kinet-neon/30 px-3 py-1 rounded-full text-[10px] font-mono text-kinet-neon tracking-widest uppercase mb-2">
        <span>FASE 1 DE 3</span>
      </div>
      <h1 class="font-display font-black text-2xl md:text-3xl text-white tracking-wide">SELECCIONA TU PERFIL TÉCNICO</h1>
      <p class="text-xs text-slate-400 max-w-md mx-auto">
        Elige tu rol principal en la plataforma KINET para personalizar tu entorno, métricas e interfaz especializada.
      </p>
    </div>

    <!-- SELECTOR DE ROLES -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- ROL 1: ATLETA -->
      <button onclick="selectRoleAndNavigate('athlete')" class="glass-card p-6 rounded-2xl border-slate-800 hover:border-kinet-neon transition text-left group flex flex-col justify-between space-y-6 hover:shadow-[0_0_25px_rgba(0,255,102,0.15)]">
        <div class="space-y-4">
          <div class="w-12 h-12 rounded-xl bg-kinet-neon/10 border border-kinet-neon/30 flex items-center justify-center text-kinet-neon group-hover:bg-kinet-neon group-hover:text-black transition">
            <i data-lucide="user" class="w-6 h-6"></i>
          </div>
          <div>
            <h3 class="font-display font-bold text-lg text-white group-hover:text-kinet-neon transition">ATLETA</h3>
            <p class="text-[10px] font-mono text-slate-500 uppercase tracking-wider mt-0.5">Jugadores / Deportistas</p>
          </div>
          <p class="text-xs text-slate-400 leading-relaxed">
            Gestión de pasaporte biométrico, historial de rendimiento, vídeo-análisis e identidad digital unificada.
          </p>
        </div>
        <div class="flex items-center space-x-2 text-xs font-bold text-kinet-neon pt-2 border-t border-slate-800/80">
          <span>Configurar Atleta</span>
          <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition"></i>
        </div>
      </button>

      <!-- ROL 2: ENTRENADOR -->
      <button onclick="selectRoleAndNavigate('coach')" class="glass-card p-6 rounded-2xl border-slate-800 hover:border-kinet-neon transition text-left group flex flex-col justify-between space-y-6 hover:shadow-[0_0_25px_rgba(0,255,102,0.15)]">
        <div class="space-y-4">
          <div class="w-12 h-12 rounded-xl bg-kinet-neon/10 border border-kinet-neon/30 flex items-center justify-center text-kinet-neon group-hover:bg-kinet-neon group-hover:text-black transition">
            <i data-lucide="clipboard-list" class="w-6 h-6"></i>
          </div>
          <div>
            <h3 class="font-display font-bold text-lg text-white group-hover:text-kinet-neon transition">ENTRENADOR</h3>
            <p class="text-[10px] font-mono text-slate-500 uppercase tracking-wider mt-0.5">Staff Técnico / Preparadores</p>
          </div>
          <p class="text-xs text-slate-400 leading-relaxed">
            Gestión de plantilla, planificación de entrenamientos, análisis táctico e informes de desarrollo de jugadores.
          </p>
        </div>
        <div class="flex items-center space-x-2 text-xs font-bold text-kinet-neon pt-2 border-t border-slate-800/80">
          <span>Configurar Staff</span>
          <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition"></i>
        </div>
      </button>

      <!-- ROL 3: OJEADOR / CLUB -->
      <button onclick="selectRoleAndNavigate('scout')" class="glass-card p-6 rounded-2xl border-slate-800 hover:border-kinet-neon transition text-left group flex flex-col justify-between space-y-6 hover:shadow-[0_0_25px_rgba(0,255,102,0.15)]">
        <div class="space-y-4">
          <div class="w-12 h-12 rounded-xl bg-kinet-neon/10 border border-kinet-neon/30 flex items-center justify-center text-kinet-neon group-hover:bg-kinet-neon group-hover:text-black transition">
            <i data-lucide="search" class="w-6 h-6"></i>
          </div>
          <div>
            <h3 class="font-display font-bold text-lg text-white group-hover:text-kinet-neon transition">OJEADOR / CLUB</h3>
            <p class="text-[10px] font-mono text-slate-500 uppercase tracking-wider mt-0.5">Scouting / Dirección Deportiva</p>
          </div>
          <p class="text-xs text-slate-400 leading-relaxed">
            Búsqueda de talento verificado, comparativas de rendimiento, generación de reportes B2B y seguimiento de mercado.
          </p>
        </div>
        <div class="flex items-center space-x-2 text-xs font-bold text-kinet-neon pt-2 border-t border-slate-800/80">
          <span>Configurar Club</span>
          <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition"></i>
        </div>
      </button>

    </div>

    <!-- FOOTER -->
    <div class="text-center pt-4">
      <p class="text-[10px] text-slate-500 font-mono">KINET OS • ROLE GATEWAY V2.7</p>
    </div>

  </div>

  <script>
    lucide.createIcons();

    function selectRoleAndNavigate(role) {
      // Guardar rol seleccionado en almacenamiento local
      localStorage.setItem('kinet_role', role);

      // Enrutamiento dinámico según el rol
      if (role === 'coach') {
        window.location.href = 'onboarding_coach_pro.html';
      } else if (role === 'scout') {
        window.location.href = 'onboarding_scout_pro.html';
      } else {
        window.location.href = 'onboarding_pro.html';
      }
    }
  </script>
</body>
</html>
