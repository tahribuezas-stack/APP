<!DOCTYPE html>
<html lang="es" class="h-full bg-[#080A0C]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINET OS - Redirección a la Plataforma</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300FF66'/%3E%3Ctext x='50' y='72' font-size='65' font-weight='900' font-family='Arial, sans-serif' text-anchor='middle' fill='%23000000'%3EK%3C/text%3E%3C/svg%3E">

  <!-- SOPORTE DE MOTION Y SPOTLIGHT (LUZ QUE SIGUE EL CURSOR) -->
  <link rel="stylesheet" href="kinet-motion.css">
  <script src="kinet-spotlight.js" defer></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kinet: {
              neon: '#00FF66',
              titanium: '#0F1215',
              'titanium-light': '#181C22',
              'titanium-border': '#262D37',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    .bg-cyber-pattern {
      background-color: #080A0C;
      background-image: radial-gradient(circle at 50% 35%, rgba(0, 255, 102, 0.15) 0%, rgba(15, 18, 21, 0.85) 75%);
    }
    .glass-card {
      background: rgba(19, 23, 29, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* EFECTO NEÓN Y SOMBRA PARA EL LOGO */
    .logo-glow {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .logo-glow:hover {
      transform: scale(1.06);
    }
    .logo-glow:hover .logo-icon {
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.8), 0 0 15px rgba(0, 255, 102, 0.5);
      border-color: rgba(0, 255, 102, 0.8);
    }
    .logo-glow:hover .logo-text {
      text-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
    }

    /* ANIMACIONES DE ENTRADA Y SALIDA */
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop-in {
      animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .page-exit {
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.35s ease-in-out;
    }
  </style>
</head>
<body style="--spotlight-color: rgba(0, 255, 102, 0.25);" class="bg-cyber-pattern text-slate-100 font-sans min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 selection:bg-kinet-neon selection:text-black transition-opacity duration-300" id="main-body">

  <div></div> <!-- Espaciador superior para centrar -->

  <!-- CONTENEDOR CENTRAL CON ANIMACIÓN -->
  <div class="max-w-md w-full space-y-6 text-center my-auto animate-pop-in">
    
    <!-- ISOLOGOTIPO KINET (CLICABLE, SE ILUMINA CON NEÓN Y REDIRIGE) -->
    <div onclick="volverAIndex()" class="inline-flex items-center space-x-3 mb-2 logo-glow cursor-pointer select-none group">
      <div class="logo-icon w-12 h-12 rounded-2xl bg-gradient-to-br from-kinet-neon to-emerald-600 font-display font-black text-black text-2xl flex items-center justify-center shadow-[0_0_25px_rgba(0,255,102,0.4)] border border-transparent transition-all duration-300">
        K
      </div>
      <div class="text-left">
        <h1 class="logo-text font-display font-black text-xl tracking-[0.2em] text-white leading-none transition-all duration-300">KINET OS</h1>
        <p class="text-[10px] text-kinet-neon font-mono tracking-widest uppercase mt-1">PRECISION PLATFORM</p>
      </div>
    </div>

    <!-- TARJETA DE OPCIONES (CON SPOTLIGHT ACTIVO) -->
    <div class="spotlight-card glass-card p-8 rounded-3xl space-y-6 border border-slate-800 shadow-[0_20px_50px_rgba(0,0,0,0.8)] relative overflow-hidden">
      
      <!-- BOTÓN VOLVER DENTRO DEL RECUADRO (ESQUINA SUPERIOR IZQUIERDA) -->
      <button onclick="volverAIndex()" class="absolute top-4 left-4 p-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-white border border-slate-800 transition text-xs font-mono group cursor-pointer flex items-center space-x-1.5 z-10" title="Volver al Inicio">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5 group-hover:-translate-x-0.5 transition-transform"></i>
        <span class="text-[10px] uppercase tracking-wider">Volver</span>
      </button>

      <div class="space-y-2 pt-4">
        <h2 class="font-display font-bold text-lg text-white">¿Cómo quieres acceder?</h2>
        <p class="text-xs text-slate-400 leading-relaxed">
          Para una mejor experiencia con métricas en tiempo real y notificaciones del cuerpo técnico, te recomendamos usar la aplicación.
        </p>
      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div class="space-y-3 pt-2">
        <button onclick="abrirEnApp()" class="w-full py-4 px-6 rounded-2xl bg-kinet-neon text-black font-display font-black text-xs tracking-wider uppercase hover:bg-emerald-400 hover:shadow-[0_0_30px_rgba(0,255,102,0.5)] transition-all duration-300 flex items-center justify-center space-x-3 cursor-pointer group">
          <i data-lucide="smartphone" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
          <span>Abrir en la App KINET</span>
        </button>

        <button onclick="seguirEnNavegador()" class="w-full py-3.5 px-6 rounded-2xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white font-display font-bold text-xs tracking-wider uppercase border border-slate-700/80 hover:border-slate-500 transition-all duration-300 flex items-center justify-center space-x-2 cursor-pointer">
          <i data-lucide="globe" class="w-4 h-4 text-slate-400"></i>
          <span>Continuar en Navegador</span>
        </button>
      </div>

      <!-- ESTATUS Y DETECCIÓN -->
      <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] font-mono text-slate-500">
        <span class="flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full bg-kinet-neon animate-pulse"></span>
          <span class="text-slate-400">PWA DETECTADA</span>
        </span>
        <span class="text-slate-500">v2.8 OS</span>
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="pb-2 text-center">
    <p class="text-[11px] text-slate-600 font-mono">
      © 2026 KINET OS • AI Performance Ecosystem
    </p>
  </div>

  <script>
    lucide.createIcons();

    function volverAIndex() {
      const body = document.getElementById('main-body');
      body.classList.add('page-exit');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 350);
    }

    function abrirEnApp() {
      const appUrl = "kinetos://app"; 
      const fallbackUrl = "login.html"; 

      window.location.href = appUrl;
      
      setTimeout(() => {
        window.location.href = fallbackUrl;
      }, 1200);
    }

    function seguirEnNavegador() {
      const body = document.getElementById('main-body');
      body.classList.add('page-exit');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 350);
    }
  </script>

</body>
</html>
