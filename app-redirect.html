<!DOCTYPE html>
<html lang="es" class="h-full bg-[#080A0C]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINET OS - Redirección a la Plataforma</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300FF66'/%3E%3Ctext x='50' y='72' font-size='65' font-weight='900' font-family='Arial, sans-serif' text-anchor='middle' fill='%23000000'%3EK%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kinet: {
              neon: '#00FF66',
              titanium: '#0F1215',
              'titanium-light': '#181C22',
              'titanium-border': '#262D37',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    .bg-cyber-pattern {
      background-color: #080A0C;
      background-image: radial-gradient(circle at 50% 30%, rgba(0, 255, 102, 0.15) 0%, rgba(15, 18, 21, 0.8) 70%);
    }
    .glass-card {
      background: rgba(19, 23, 29, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-cyber-pattern text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 selection:bg-kinet-neon selection:text-black">

  <div class="max-w-md w-full space-y-6 text-center">
    
    <!-- ISOLOGOTIPO KINET -->
    <div class="inline-flex items-center space-x-3 mb-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-kinet-neon to-emerald-600 font-display font-black text-black text-2xl flex items-center justify-center shadow-[0_0_25px_rgba(0,255,102,0.4)]">
        K
      </div>
      <div class="text-left">
        <h1 class="font-display font-black text-xl tracking-[0.2em] text-white leading-none">KINET OS</h1>
        <p class="text-[10px] text-kinet-neon font-mono tracking-widest uppercase mt-1">PRECISION PLATFORM</p>
      </div>
    </div>

    <!-- TARJETA DE OPCIONES -->
    <div class="glass-card p-8 rounded-3xl space-y-6 border border-slate-800 shadow-2xl relative overflow-hidden">
      
      <div class="space-y-2">
        <h2 class="font-display font-bold text-lg text-white">¿Cómo quieres acceder?</h2>
        <p class="text-xs text-slate-400 leading-relaxed">
          Para una mejor experiencia con métricas en tiempo real y notificaciones del cuerpo técnico, te recomendamos usar la aplicación.
        </p>
      </div>

      <!-- BOTÓN PRINCIPAL: ABRIR EN APP -->
      <div class="space-y-3 pt-2">
        <button onclick="abrirEnApp()" class="w-full py-4 px-6 rounded-2xl bg-kinet-neon text-black font-display font-black text-xs tracking-wider uppercase hover:bg-emerald-400 transition shadow-[0_0_25px_rgba(0,255,102,0.35)] flex items-center justify-center space-x-3 cursor-pointer">
          <i data-lucide="smartphone" class="w-5 h-5"></i>
          <span>Abrir en la App KINET</span>
        </button>

        <!-- BOTÓN SECUNDARIO: SEGUIR EN NAVEGADOR -->
        <button onclick="seguirEnNavegador()" class="w-full py-3.5 px-6 rounded-2xl bg-slate-900 hover:bg-slate-800 text-slate-300 font-display font-bold text-xs tracking-wider uppercase border border-slate-700/80 transition flex items-center justify-center space-x-2 cursor-pointer">
          <i data-lucide="globe" class="w-4 h-4 text-slate-400"></i>
          <span>Continuar en Navegador</span>
        </button>
      </div>

      <!-- ESTATUS Y DETECCIÓN -->
      <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] font-mono text-slate-500">
        <span id="dispositivo-tag" class="flex items-center space-x-1">
          <span class="w-2 h-2 rounded-full bg-kinet-neon animate-pulse"></span>
          <span>SISTEMA DETECTADO</span>
        </span>
        <span class="text-slate-400">v2.8 PWA</span>
      </div>

    </div>

    <p class="text-[11px] text-slate-500 font-mono">
      © 2026 KINET OS • AI Performance Ecosystem
    </p>

  </div>

  <script>
    lucide.createIcons();

    function abrirEnApp() {
      // Intenta abrir mediante Deep Link o activa el prompt de instalación PWA
      const appUrl = "kinetos://app"; 
      const fallbackUrl = "app-index.html"; // Redirige a la pantalla interna de la app

      window.location.href = appUrl;
      
      setTimeout(() => {
        window.location.href = fallbackUrl;
      }, 1200);
    }

    function seguirEnNavegador() {
      // Redirige al panel web o a la landing
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
