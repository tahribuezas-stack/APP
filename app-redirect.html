<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINET OS // Sincronizando Sesión...</title>
  <style>
    body {
      background: #06080E;
      color: #F8FAFC;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .loader {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(16, 185, 129, 0.18);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 18px;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: #94A3B8;
      text-transform: uppercase;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="loader" id="sync-spinner"></div>
  <div class="status" id="sync-text">Verificando credenciales KINET OS...</div>

  <script>
    (function routeKinetSession() {
      // 1. Comprobar si existe sesión activa (Registrado o Invitado persistente)
      const isLogged = localStorage.getItem('kinet_logged_in') === 'true' 
                    || localStorage.getItem('kinet_guest_session') === 'true'
                    || localStorage.getItem('kinet_user_email') !== null
                    || localStorage.getItem('kinet_auth') === 'true';

      // 2. Comprobar si ya tiene algún perfil configurado
      const profilesMap = JSON.parse(localStorage.getItem('kinet_profiles_db') || '{}');
      const hasAnyProfile = localStorage.getItem('kinet_profile_completed') === 'true'
                         || Object.keys(profilesMap).length > 0
                         || localStorage.getItem('kinet_role') !== null;

      const activeRole = localStorage.getItem('kinet_active_role') || 'athlete';

      // Ajustar color del spinner según el rol guardado
      const spinner = document.getElementById('sync-spinner');
      if (activeRole === 'staff') {
        spinner.style.borderTopColor = '#F59E0B';
        spinner.style.boxShadow = '0 0 25px rgba(245, 158, 11, 0.25)';
      } else if (activeRole === 'scout') {
        spinner.style.borderTopColor = '#3B82F6';
        spinner.style.boxShadow = '0 0 25px rgba(59, 130, 246, 0.25)';
      }

      setTimeout(() => {
        if (isLogged && hasAnyProfile) {
          // Ya tiene cuenta/invitado y perfil creado -> Directo a la App
          window.location.replace('app.html?role=' + activeRole);
        } else if (isLogged && !hasAnyProfile) {
          // Ya inició sesión o es invitado, pero le falta crear perfil -> Fase 1
          window.location.replace('fase1.html');
        } else if (!isLogged && hasAnyProfile) {
          // Si tenía datos de invitado guardados de antes, restaurar sesión invitado y entrar a la App
          localStorage.setItem('kinet_guest_session', 'true');
          window.location.replace('app.html?role=' + activeRole);
        } else {
          // Usuario nuevo sin sesión -> Login
          window.location.replace('login.html');
        }
      }, 280);
    })();
  </script>
</body>
</html>
