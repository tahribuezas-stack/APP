<!DOCTYPE html>
<html lang="es" class="h-full bg-[#080A0C]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINET OS - Scout & Sports Director Calibration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { kinet: { neon: '#00FF66', titanium: '#0F1215', 'titanium-border': '#262D37' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Orbitron', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .bg-cyber-pattern { background-color: #080A0C; background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 60%); }
    .glass-card { background: rgba(19, 23, 29, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-cyber-pattern text-slate-100 font-sans min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div class="relative w-full max-w-3xl bg-[#0A0C0E] sm:rounded-[28px] border border-blue-500/30 shadow-[0_0_80px_rgba(0,0,0,0.95)] p-6 space-y-6">
    
    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-500 text-white font-display font-black text-xl flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.4)]">
          S
        </div>
        <div>
          <h1 class="font-display font-black text-lg text-white">KINET OS • SCOUTING B2B</h1>
          <p class="text-[9px] text-blue-400 font-mono tracking-widest uppercase">ANÁLISIS DE MERCADO & FICHAJES</p>
        </div>
      </div>
      <button onclick="window.location.href='fase1.html'" class="px-3 py-1 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-400 hover:text-white">Volver</button>
    </div>

    <div class="space-y-4">
      <h2 class="font-display font-bold text-sm text-blue-400">1. CONFIGURACIÓN DE RED DE SCOUTING</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="glass-card p-4 rounded-xl border border-slate-800 space-y-2">
          <label class="text-[10px] font-mono text-slate-400 uppercase">Mercado de Actuación</label>
          <select id="scout-market" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
            <option>Fútbol Internacional / Global</option>
            <option>Canteras y Fútbol Base Europeo</option>
            <option>Latinoamérica & Emerging Markets</option>
            <option>Multi-Sport Scouting B2B</option>
          </select>
        </div>
        <div class="glass-card p-4 rounded-xl border border-slate-800 space-y-2">
          <label class="text-[10px] font-mono text-slate-400 uppercase">Algoritmo de Valoración</label>
          <select id="scout-algo" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
            <option>GRL Index & Potencial de Reventa</option>
            <option>Rendimiento Biométrico & Lesiones</option>
            <option>Táctico Avanzado (Expected Impact)</option>
          </select>
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl border border-slate-800 space-y-2">
        <label class="text-[10px] font-mono text-slate-400 uppercase">Nombre de la Agencia / Club Representado</label>
        <input type="text" id="scout-agency" placeholder="Ej: Global Elite Scouting Agency" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
      </div>

      <button onclick="finishScoutOnboarding()" class="w-full py-3.5 rounded-xl bg-blue-500 text-white font-display font-black text-xs tracking-wider uppercase hover:bg-blue-400 transition shadow-[0_0_20px_rgba(59,130,246,0.3)]">
        INICIAR PANEL DE OJEADOR & MERCADO 🚀
      </button>
    </div>

  </div>

  <script>
    lucide.createIcons();
    function finishScoutOnboarding() {
      localStorage.setItem('kinet_role', 'Director Deportivo / Head Scout');
      localStorage.setItem('kinet_scout_market', document.getElementById('scout-market').value);
      localStorage.setItem('kinet_scout_algo', document.getElementById('scout-algo').value);
      localStorage.setItem('kinet_agency_name', document.getElementById('scout-agency').value || 'KINET Scouting Network');
      localStorage.setItem('kinet_profile_completed', 'true');
      
      // Redirige directamente al panel del ojeador sin bucles
      window.location.href = 'dashboard_scout.html';
    }
  </script>
</body>
</html>
