<script>
    lucide.createIcons();

    let state = {
      role: 'Atleta / Jugador',
      sport: 'Fútbol',
      customSportName: '',
      category: 'Profesional High-Performance',
      position: 'Delantero Centro / Nueve (DC)',
      altura: '178',
      peso: '72.5',
      edad: '22',
      birthdate: '',
      laterality: 'Diestro',
      aiCompleted: false,
      chatStepIndex: 0,
      chatAnswers: [],
      extracted: {
        club: '',
        city: '',
        hometown: '',
        strength: '',
        weakness: '',
        schedule: '',
        injuryHistory: '',
        seasonGoal: '',
        transfermarktUrl: '',
        videoUrl: ''
      }
    };

    const SPORT_LATERALITY_OPTIONS = {
      'Fútbol': { label: '🦶 Pierna Hábil', opts: ['Diestro', 'Zurdo', 'Ambidiestro (2 Piernas)', 'Diestro (Maneja Zurda)'] },
      'Baloncesto': { label: '✋ Mano de Tiro', opts: ['Diestro', 'Zurdo', 'Ambidiestro en Finalización'] },
      'Pádel / Tenis': { label: '✋ Mano y Revés', opts: ['Diestro (Revés a 2 Manos)', 'Diestro (Revés a 1 Mano)', 'Zurdo (Bandera / Sombra)'] },
      'Boxeo / MMA': { label: '🛡️ Guardia de Combate', opts: ['Guardia Ortodoxa (Diestro)', 'Guardia Zurda (Southpaw)', 'Ambidiestro (Switch-Hitter)'] },
      'Running': { label: '👟 Tipo de Pisada', opts: ['Pisada Neutra (Mediopié)', 'Pisada Neutra (Antepié)', 'Ligero Pronador'] },
      'Otros Deportes': { label: '⚡ Lateralidad', opts: ['Diestro', 'Zurdo', 'Ambidiestro'] }
    };

    window.addEventListener('DOMContentLoaded', () => {
      renderCategories();
      renderSportPitch();
      updateLateralitySelectorBySport();
    });

    function cambiarPagina(event, urlDestino) {
      if (event) event.preventDefault();
      const contenedor = document.querySelector('.card-liquid-transition');
      if (contenedor) contenedor.classList.add('page-exit');
      setTimeout(() => {
        window.location.href = urlDestino;
      }, 240);
    }

    function nextStep(stepNum) {
      const visualStep = stepNum - 1;
      const stepNumEl = document.getElementById('step-num');
      if (stepNumEl) stepNumEl.textContent = "0" + (visualStep > 0 ? visualStep : 1);
      
      for (let i = 1; i <= 6; i++) {
        const el = document.getElementById('step-' + i);
        if (el) {
          el.classList.add('hidden');
          el.classList.remove('step-liquid-enter');
        }
      }

      const target = document.getElementById('step-' + stepNum);
      if (target) {
        target.classList.remove('hidden');
        void target.offsetWidth;
        target.classList.add('step-liquid-enter');
      }

      if (stepNum === 3) renderCategories();
      else if (stepNum === 4) renderSportPitch();
      else if (stepNum === 5) updateLateralitySelectorBySport();
      else if (stepNum === 6) setupAiChatGreeting();
    }

    function selectSport(val) {
      state.sport = val;
      document.querySelectorAll('[id^="sport-"]').forEach(el => el.className = "glass-card p-5 rounded-2xl cursor-pointer space-y-3");
      const map = { 'Fútbol': 'futbol', 'Baloncesto': 'baloncesto', 'Pádel / Tenis': 'padel', 'Boxeo / MMA': 'boxeo', 'Running': 'running', 'Otros Deportes': 'otros' };
      if (map[val]) document.getElementById('sport-' + map[val]).className = "glass-card selected p-5 rounded-2xl cursor-pointer space-y-3 bg-kinet-neon/5";
    }

    function updateLateralitySelectorBySport() {
      const cfg = SPORT_LATERALITY_OPTIONS[state.sport] || SPORT_LATERALITY_OPTIONS['Fútbol'];
      const lblEl = document.getElementById('onboarding-lat-label');
      const pillsBox = document.getElementById('onboarding-laterality-pills');
      if (lblEl) lblEl.textContent = cfg.label;
      if (!pillsBox) return;

      if (!cfg.opts.includes(state.laterality)) {
        state.laterality = cfg.opts[0];
      }
      document.getElementById('val-laterality').textContent = state.laterality;

      pillsBox.innerHTML = cfg.opts.map((opt) => {
        const active = opt === state.laterality;
        return `<button type="button" onclick="selectOnboardingLaterality('${opt.replace(/'/g, "\\'")}', this)" class="${active ? 'px-3 py-1.5 rounded-xl bg-kinet-neon text-black font-bold text-xs' : 'px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 text-xs hover:text-white'}">${opt}</button>`;
      }).join('');
    }

    function selectOnboardingLaterality(val, btnEl) {
      state.laterality = val;
      const disp = document.getElementById('val-laterality');
      if (disp) disp.textContent = val;
      const parent = document.getElementById('onboarding-laterality-pills');
      if (parent) {
        Array.from(parent.children).forEach(b => {
          b.className = "px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 text-xs hover:text-white";
        });
      }
      if (btnEl) btnEl.className = "px-3 py-1.5 rounded-xl bg-kinet-neon text-black font-bold text-xs";
    }

    function syncAgeSliderWithDate(ageVal) {
      state.edad = String(ageVal);
      document.getElementById('val-edad').textContent = `${ageVal} años`;
    }

    function syncDateWithAgeSlider(dateStr) {
      if (!dateStr) return;
      state.birthdate = dateStr;
      const b = new Date(dateStr);
      if (isNaN(b.getTime())) return;
      const today = new Date();
      let age = today.getFullYear() - b.getFullYear();
      const m = today.getMonth() - b.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
      if (age >= 8 && age <= 65) {
        state.edad = String(age);
        document.getElementById('slider-edad').value = age;
        document.getElementById('val-edad').textContent = `${age} años`;
      }
    }

    function renderCategories() {
      const container = document.getElementById('categories-container');
      const sport = state.sport;
      let catData = [];

      if (sport === 'Boxeo / MMA') {
        catData = [
          { icon: '🥊', title: 'Local / Gimnasio (Sparring)', desc: 'Entrenamientos técnicos e interclubes.' },
          { icon: '🥉', title: 'Regional / Veladas Autonómicas', desc: 'Veladas de boxeo o MMA amateur oficial.' },
          { icon: '🥈', title: 'Nacional (Campeonatos FEBoxeo)', desc: 'Torneos oficiales de federación nacional.' },
          { icon: '🥇', title: 'Internacional / Profesional', desc: 'Rankings profesionales (WBC, WBA, UFC).' }
        ];
      } else if (sport === 'Pádel / Tenis') {
        catData = [
          { icon: '⚡', title: 'Social / Club (4ª - 3ª Categoría)', desc: 'Partidos de club, ligas sociales y pozos.' },
          { icon: '🥉', title: 'Federado Autonómico (2ª Categoría)', desc: 'Ligas regionales y torneos absolutos.' },
          { icon: '🥈', title: 'Nacional / 1ª Categoría Absoluta', desc: 'Cuadros principales y pruebas nacionales.' },
          { icon: '🥇', title: 'Circuito Internacional (FIP / ATP)', desc: 'Premier Padel, FIP Tour, ITF, ATP/WTA.' }
        ];
      } else if (sport === 'Baloncesto') {
        catData = [
          { icon: '⚡', title: 'Basket Social / Circuito 3x3', desc: 'Ligas municipales y torneos 3x3.' },
          { icon: '🌱', title: 'Cantera / Junior Preferente-Autonómico', desc: 'Categorías de formación federadas.' },
          { icon: '📜', title: 'Senior Nacional / Tercera FEB (EBA)', desc: 'Competición federada autonómica y nacional.' },
          { icon: '🥇', title: 'Profesional Élite (ACB / FEB)', desc: 'Primera/Segunda FEB, Liga Endesa, EuroLeague.' }
        ];
      } else if (sport === 'Running') {
        catData = [
          { icon: '🏃', title: 'Corredor Popular / 5K - 10K', desc: 'Carreras populares homologadas en ruta.' },
          { icon: '🥉', title: 'Amateur Competitivo (Sub-40 / Media)', desc: 'Preparación específica por ritmos y series.' },
          { icon: '📜', title: 'Federado RFEA / Maratoniano', desc: 'Licencia oficial en pista, cross o 42K.' },
          { icon: '🥇', title: 'Élite / Internacional', desc: 'Meetings nacionales y World Marathon Majors.' }
        ];
      } else {
        catData = [
          { icon: '⚡', title: 'Aficionado / Fútbol 7 & Barrio', desc: 'Ligas locales y torneos competitivos.' },
          { icon: '🌱', title: 'Cantera / Juvenil División de Honor', desc: 'Cadete, Juvenil Nacional y División de Honor.' },
          { icon: '📜', title: 'Senior Regional / Preferente', desc: 'Divisiones autonómicas federadas.' },
          { icon: '🥈', title: 'Semiprofesional (3ª / 2ª RFEF)', desc: 'Competición nacional de alto rendimiento.' },
          { icon: '🥇', title: 'Profesional Élite (1ª RFEF / LaLiga)', desc: 'Estructura profesional de máxima exigencia.' }
        ];
      }

      state.category = catData[0].title;
      container.innerHTML = '';

      catData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = index === 0 
          ? "glass-card selected p-4 rounded-2xl border-2 border-kinet-neon cursor-pointer transition bg-kinet-neon/5 flex items-center space-x-3.5"
          : "glass-card p-4 rounded-2xl border-2 border-slate-800 cursor-pointer transition hover:border-slate-600 flex items-center space-x-3.5";

        div.onclick = () => {
          state.category = item.title;
          Array.from(container.children).forEach(c => c.className = "glass-card p-4 rounded-2xl border-2 border-slate-800 cursor-pointer transition hover:border-slate-600 flex items-center space-x-3.5");
          div.className = "glass-card selected p-4 rounded-2xl border-2 border-kinet-neon cursor-pointer transition bg-kinet-neon/5 flex items-center space-x-3.5";
        };

        div.innerHTML = `
          <div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-xl shrink-0">${item.icon}</div>
          <div>
            <h3 class="font-display font-bold text-xs text-white">${item.title}</h3>
            <p class="text-[11px] text-slate-400 mt-0.5">${item.desc}</p>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Pistas interactivas con líneas SVG reglamentarias y posiciones sincronizadas con el catálogo de perfil.html

          </div>

        setSubOptions(['Delantero Centro / Nueve (DC)', 'Segundo Delantero / Media Punta (SD)']);

      } else if (sport === 'Baloncesto') {
        title.textContent = "3. CANCHA DE BALONCESTO & DEMARCACIÓN";
        subtitle.textContent = "Selecciona tu posición oficial en pista.";
        container.className = "relative w-full h-[255px] pitch-basket rounded-2xl p-4 flex flex-col justify-between overflow-hidden";
        container.innerHTML = `
          <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-25" viewBox="0 0 400 250" preserveAspectRatio="none">

            <button type="button" onclick="activatePitchNode(this, ['Base Director / Playmaker (PG)', 'Especialista 3x3 Polivalente'])" class="pitch-node-btn active-node px-3.5 py-2 rounded-xl bg-amber-500/20 border border-amber-400 text-amber-300 font-display font-bold text-xs">1. BASE (PG)</button>
            <button type="button" onclick="activatePitchNode(this, ['Escolta Tirador / Combo Guard (SG)', 'Especialista 3x3 Polivalente'])" class="pitch-node-btn px-3.5 py-2 rounded-xl bg-amber-500/20 border border-amber-400 text-amber-300 font-display font-bold text-xs">2. ESCOLTA (SG)</button>
          </div>
          <div class="flex justify-center items-center z-10">
            <button type="button" onclick="activatePitchNode(this, ['Alero Versátil / 3&D (SF)', 'Especialista 3x3 Polivalente'])" class="pitch-node-btn px-4 py-2 rounded-xl bg-amber-500/20 border border-amber-400 text-amber-300 font-display font-bold text-xs">3. ALERO (SF)</button>
          </div>
          <div class="flex justify-around items-center z-10 pb-2">
            <button type="button" onclick="activatePitchNode(this, ['Ala-Pívot Abierto / Stretch 4 (PF)'])" class="pitch-node-btn px-3.5 py-2 rounded-xl bg-amber-500/20 border border-amber-400 text-amber-300 font-display font-bold text-xs">4. ALA-PÍVOT (PF)</button>

          </div>
        `;
        setSubOptions(['Base Director / Playmaker (PG)', 'Especialista 3x3 Polivalente']);

      } else if (sport === 'Pádel / Tenis') {

        subtitle.textContent = "Elige tu lado en el 20x10m o tu estilo de pista individual.";
        container.className = "relative w-full h-[255px] pitch-padel rounded-2xl p-4 flex flex-col justify-around items-center overflow-hidden";
        container.innerHTML = `
          <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-25" viewBox="0 0 400 250" preserveAspectRatio="none">
            <rect x="20" y="12" width="360" height="226" fill="none" stroke="#3B82F6" stroke-width="2"/>

            <line x1="20" y1="205" x2="380" y2="205" stroke="#3B82F6" stroke-width="1.5"/>

            <button type="button" onclick="activatePitchNode(this, ['Pádel: Jugador de Drive (Construcción y Defensa)', 'Pádel: Polivalente Ambos Lados (Drive / Revés)'])" class="pitch-node-btn px-4 py-2.5 rounded-xl bg-blue-500/20 border border-blue-400 text-blue-300 font-display font-bold text-xs">🛡️ LADO DRIVE (DERECHA)</button>

        title.textContent = "3. RING / OCTÁGONO & ESTILO DE COMBATE";

        container.innerHTML = `
          <div class="grid grid-cols-2 gap-3 w-full z-10">
            <button type="button" onclick="activatePitchNode(this, ['Velocista Pista (100m / 200m / 400m)', 'Medio Fondo en Pista (800m / 1500m)'])" class="pitch-node-btn active-node p-3.5 rounded-xl bg-purple-500/20 border border-purple-400 text-purple-300 font-display font-bold text-xs">⚡ VELOCIDAD & MEDIO FONDO</button>
            <button type="button" onclick="activatePitchNode(this, ['Fondo en Ruta (5K / 10K Homologado)', 'Opositor / Pruebas Físicas (CNPn / Bomberos)'])" class="pitch-node-btn p-3.5 rounded-xl bg-purple-500/20 border border-purple-400 text-purple-300 font-display font-bold text-xs">🏃 RUTA 5K / 10K & OPOSICIÓN</button>
            <button type="button" onclick="activatePitchNode(this, ['Especialista en Media Maratón (21K)', 'Maratoniano Oficial (42.195m)'])" class="pitch-node-btn p-3.5 rounded-xl bg-purple-500/20 border border-purple-400 text-purple-300 font-display font-bold text-xs">🏅 MEDIA MARATÓN & MARATÓN 42K</button>
            <button type="button" onclick="activatePitchNode(this, ['Trail Running / Carreras por Montaña'])" class="pitch-node-btn p-3.5 rounded-xl bg-purple-500/20 border border-purple-400 text-purple-300 font-display font-bold text-xs">⛰️ TRAIL RUNNING / ULTRA</button>
          </div>
        `;
        setSubOptions(['Fondo en Ruta (5K / 10K Homologado)', 'Especialista en Media Maratón (21K)']);

      } else {
        title.textContent = "3. IDENTIFICACIÓN DE TU ESPECIALIDAD";
        subtitle.textContent = "Escribe tu posición o prueba principal.";
        subBox.classList.add('hidden');
        container.className = "relative w-full h-[255px] pitch-custom rounded-2xl p-4 flex flex-col justify-center items-center space-y-3 text-center overflow-hidden";
        container.innerHTML = `
          <div class="w-10 h-10 rounded-2xl bg-kinet-neon/10 border border-kinet-neon/30 text-kinet-neon flex items-center justify-center font-bold">
            <i data-lucide="trophy" class="w-5 h-5"></i>
          </div>
          <h3 class="font-display font-bold text-xs text-white">¿Cuál es tu posición o especialidad principal?</h3>
          <input type="text" id="custom-sport-input" placeholder="Ej: Central, Apertura, Velocista..." oninput="state.position = this.value" class="w-full max-w-sm bg-[#080A0C] border border-kinet-neon/40 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-kinet-neon transition text-center font-bold">
        `;
        lucide.createIcons();
      }
    }

    function activatePitchNode(btnEl, cleanCatalogOptions) {
      document.querySelectorAll('#pitch-container .pitch-node-btn').forEach(b => b.classList.remove('active-node'));
      if (btnEl) btnEl.classList.add('active-node');
      setSubOptions(cleanCatalogOptions);
    }

    // Guarda exactamente el nombre limpio del catálogo de perfil.html (sin duplicar paréntesis)
    function setSubOptions(opts) {
      const display = document.getElementById('selected-pos-display');
      const box = document.getElementById('sub-position-options');
      state.position = opts[0];
      if (display) display.textContent = state.position;
      if (!box) return;
      box.innerHTML = '';

      opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = idx === 0
          ? "px-3 py-1.5 rounded-xl bg-kinet-neon text-black font-bold text-xs transition"
          : "px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 text-xs hover:text-white transition";
        btn.textContent = opt;
        btn.onclick = () => {
          state.position = opt;
          if (display) display.textContent = state.position;
          Array.from(box.children).forEach(b => b.className = "px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 text-xs hover:text-white transition");
          btn.className = "px-3 py-1.5 rounded-xl bg-kinet-neon text-black font-bold text-xs transition";
        };
        box.appendChild(btn);
      });
    }

    // =========================================================================
    // MOTOR DE ENTREVISTA PROFUNDA DE 7 PREGUNTAS CON CONECTOR API + PERSONALIZACIÓN DE VESTUARIO Y PERFIL
    // =========================================================================
    function getAiInterviewQuestions() {
      return [
        {
          id: 'q1_club',
          text: `¡Hola! Soy el Director de Rendimiento IA de KINET OS (${state.sport} • ${state.position}). Voy a hacerte **7 preguntas breves** para rellenar tu Pasaporte Deportivo y diseñar tu rutina del Vestuario.\n\n**Pregunta 1 de 7:** ¿En qué **Club, Equipo o Gimnasio** entrenas actualmente y en qué grupo o liga compites?`,
          chips: ['Juego en el KINET Performance CF', 'Soy Agente Libre / Busco Equipo', 'Compito en Juvenil División de Honor', 'Compito en Senior / 3ª RFEF']
        },
        {
          id: 'q2_cities',
          text: `Perfecto, club registrado en tu ficha. 📍 **Pregunta 2 de 7:** ¿En qué **Ciudad vives y entrenas actualmente**, y cuál es tu **Ciudad Natal / de origen**? *(Esto activará tus recomendaciones por cercanía en Comunidad)*.`,
          chips: ['Vivo en Melilla y nací en Melilla', 'Vivo en Madrid y nací en Toledo', 'Vivo en Barcelona y nací en Sevilla', 'Vivo en Valencia']
        },
        {
          id: 'q3_strength',
          text: `Genial, ubicación indexada. ⚡ **Pregunta 3 de 7:** Como **${state.position}**, ¿cuál es tu **mayor virtud o arma principal** en competición y cómo defines tu estilo de juego?`,
          chips: ['Explosividad, regate 1vs1 y velocidad punta', 'Visión de juego, último pase y control', 'Potencia de finalización y desmarque al espacio', 'Solidez defensiva, anticipación y duelo aéreo']
        },
        {
          id: 'q4_weakness',
          text: `Tomado nota para tu KINET Card. 🎯 **Pregunta 4 de 7:** ¿Qué **punto débil técnico, táctico o físico** quieres que prioricemos mejorar este mes en tus sesiones diarias de Vestuario?`,
          chips: ['Mejorar resistencia anaeróbica en últimos 20 min', 'Ganar potencia en el tren inferior y arranque', 'Pulir uso de pierna/mano no dominante', 'Mejorar toma de decisiones bajo presión']
        },
        {
          id: 'q5_schedule',
          text: `Excelente. 📅 **Pregunta 5 de 7:** ¿Cuántos **días por semana entrenas** actualmente y qué día sueles tener **partido o competición oficial**?`,
          chips: ['Entreno 4 días/semana • Partido el Sábado', 'Entreno 5 días/semana • Partido el Domingo', 'Entreno 3 días/semana + 2 de Gimnasio', 'Entreno 6 días/semana (Alto Rendimiento)']
        },
        {
          id: 'q6_health',
          text: `Configurando tu microciclo semanal. 🩺 **Pregunta 6 de 7:** ¿Tienes alguna **molestia muscular, lesión previa** que nuestro Fisioterapeuta IA deba vigilar (ej. isquios, tobillo, rodilla, hombro) y cuántas horas duermes de media?`,
          chips: ['0 lesiones activas • Duermo 8h', 'Vigilar sobrecarga en isquiotibiales • Duermo 7h', 'Prevención de esguince de tobillo/rodilla', 'Ligera fatiga lumbar • Necesito descarga']
        },
        {
          id: 'q7_goal_links',
          text: `¡Última pregunta! 🏆 **Pregunta 7 de 7:** ¿Cuál es tu **gran objetivo esta temporada**? *(Si tienes un link de Transfermarkt/BeSoccer o YouTube puedes pegarlo aquí mismo y lo pondré en tu Perfil)*.`,
          chips: ['Fichar por un club de categoría superior', 'Ser titular indiscutible y MVP de mi liga', 'Superar los 15 goles / asistencias este año', 'Alcanzar mi pico físico sin lesiones']
        }
      ];

    function appendChatMessageBubble(sender, text) {
      const box = document.getElementById('chat-messages-container');
      if (!box) return;
      const div = document.createElement('div');
      if (sender === 'ai') {
        div.className = "flex items-start space-x-2.5";
        div.innerHTML = `
          <div class="w-6 h-6 rounded-lg bg-kinet-neon/20 border border-kinet-neon/40 text-kinet-neon flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">AI</div>
          <div class="bg-slate-900/95 border border-slate-800 p-3 rounded-2xl text-xs text-slate-200 leading-relaxed max-w-[90%]">${text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong class="text-kinet-neon">$1</strong>')}</div>
        `;
      } else {
        div.className = "flex justify-end";
        div.innerHTML = `
          <div class="bg-kinet-neon/15 border border-kinet-neon/50 text-white p-2.5 px-3.5 rounded-2xl text-xs max-w-[85%] font-medium">${text}</div>
        `;
      }
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function renderQuickReplyChips(chips) {
      const chipBox = document.getElementById('ai-quick-chips');
      if (!chipBox) return;
      if (!chips || !chips.length) {
        chipBox.innerHTML = '';
        return;
      }
      chipBox.innerHTML = chips.map(c => `
        <button type="button" onclick="useQuickChipAnswer('${c.replace(/'/g, "\\'")}')" class="text-[10px] bg-slate-900 hover:bg-kinet-neon/20 border border-slate-700 hover:border-kinet-neon text-slate-300 hover:text-white px-2.5 py-1 rounded-lg transition font-mono">
          + ${c}
        </button>
      `).join('');
    }

    function useQuickChipAnswer(txt) {
      const input = document.getElementById('ai-chat-input');
      if (input) {
        input.value = txt;
        sendAiResponse();
      }
    }

    function setupAiChatGreeting() {
      const box = document.getElementById('chat-messages-container');
      if (!box) return;
      if (state.chatStepIndex === 0 && box.children.length === 0) {
        const questions = getAiInterviewQuestions();
        appendChatMessageBubble('ai', questions[0].text);
        renderQuickReplyChips(questions[0].chips);
      }
    }

    function parseAndStoreAnswerByStep(stepIdx, answerText) {
      const t = answerText.trim();
      state.chatAnswers.push(t);

      // Extraer enlaces en cualquier pregunta si el usuario pega uno
      const urls = t.match(/https?:\/\/[^\s]+/gi) || [];
      urls.forEach(u => {
        if (/transfermarkt|besoccer|rfef|boxrec|fip|atp|fiba/i.test(u)) state.extracted.transfermarktUrl = u;
        else if (/youtube|youtu\.be|vimeo|drive\.google|tiktok|instagram/i.test(u)) state.extracted.videoUrl = u;
      });

      if (stepIdx === 0) {
        // Pregunta 1: Club
        const cleanClub = t.replace(/^(juego en el|juego en|entreno en el|entreno en|mi club es|club)\s+/i, '').trim();
        state.extracted.club = cleanClub.slice(0, 42);
        document.getElementById('prev-ai-club').textContent = state.extracted.club || 'Registrado';
      } else if (stepIdx === 1) {
        // Pregunta 2: Ciudad Actual y Ciudad Natal
        const bornSplit = t.split(/y nac[ií] en|natural de|ciudad natal/i);
        if (bornSplit.length > 1) {
          state.extracted.city = bornSplit[0].replace(/^(vivo en|resido en|estoy en)\s+/i, '').replace(/[.,]/g, '').trim();
          state.extracted.hometown = bornSplit[1].replace(/[.,]/g, '').trim();
        } else {
          state.extracted.city = t.replace(/^(vivo en|resido en|soy de)\s+/i, '').replace(/[.,]/g, '').trim();
          if (!state.extracted.hometown) state.extracted.hometown = state.extracted.city;
        }
        document.getElementById('prev-ai-city').textContent = state.extracted.city || 'Registrada';
        document.getElementById('prev-ai-hometown').textContent = state.extracted.hometown || state.extracted.city;
      } else if (stepIdx === 2) {
        // Pregunta 3: Virtud principal y estilo
        state.extracted.strength = t;
      } else if (stepIdx === 3) {
        // Pregunta 4: Punto débil a pulir en Vestuario
        state.extracted.weakness = t;
        document.getElementById('prev-ai-goal').textContent = t.slice(0, 28);
      } else if (stepIdx === 4) {
        // Pregunta 5: Días de entrenamiento y partido
        state.extracted.schedule = t;
      } else if (stepIdx === 5) {
        // Pregunta 6: Salud, lesiones y sueño
        state.extracted.injuryHistory = t;
      } else if (stepIdx === 6) {
        // Pregunta 7: Objetivo de la temporada
        state.extracted.seasonGoal = t;
        document.getElementById('prev-ai-goal').textContent = t.slice(0, 28);
      }
    }

    // Llamada opcional a la API de IA (OpenAI / Gemini configurada en kinet-api-config.js) para generar el plan de Vestuario
    async function callOnboardingPersonalizationAPI() {
      const apiCfg = window.KINET_API_CONFIG || {};
      const apiKey = apiCfg.OPENAI_API_KEY || apiCfg.GEMINI_API_KEY || localStorage.getItem('kinet_ai_api_key') || '';

      const fallbackDirective = `Plan calibrado para ${state.position} en ${state.sport} (${state.category}). Foco prioritario en "${state.extracted.weakness || 'potencia elástica y velocidad de reacción'}" potenciando tu virtud (${state.extracted.strength || 'lectura táctica'}). Control de carga adaptado a: ${state.extracted.injuryHistory || '0 molestias reportadas'}.`;

      const fallbackPlan = {
        sport: state.sport,
        position: state.position,
        category: state.category,
        club: state.extracted.club,
        city: state.extracted.city,
        hometown: state.extracted.hometown,
        strength: state.extracted.strength || 'Explosividad y lectura táctica',
        weakness: state.extracted.weakness || 'Resistencia específica en tramo final',
        schedule: state.extracted.schedule || '4 sesiones/semana + Competición fin de semana',
        injuryPrevention: state.extracted.injuryHistory || 'Sin lesiones activas • Descanso óptimo',
        seasonGoal: state.extracted.seasonGoal || 'Rendimiento Élite en competición oficial',
        coachDirective: fallbackDirective,
        todayGymSession: `Gimnasio Específico (${state.sport}): Potencia Reactiva & Prevención (${state.extracted.injuryHistory ? state.extracted.injuryHistory.slice(0, 28) : 'Tren Inferior'}) (45m)`,
        todayFieldSession: `Sesión en Pista (${state.position}): ${state.extracted.weakness ? state.extracted.weakness.slice(0, 42) : 'Finalización y Transiciones de Alta Intensidad'}`,
        bioHeadline: `${state.position} en ${state.extracted.club || state.sport} (${state.category}) • Especialista en ${(state.extracted.strength || 'Alto Rendimiento').slice(0, 38)}`,
        generatedAt: new Date().toISOString()
      };

      if (!apiKey) return fallbackPlan;

      try {
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            response_format: { type: 'json_object' },
            messages: [
              {
                role: 'system',
                content: 'Eres el Director de Rendimiento de KINET OS. Devuelve SIEMPRE un JSON con las claves: club, city, hometown, coachDirective (máx 240 caracteres en español), todayGymSession, todayFieldSession, bioHeadline.'
              },
              {
                role: 'user',
                content: JSON.stringify({
                  sport: state.sport,
                  position: state.position,
                  category: state.category,
                  height: state.altura,
                  weight: state.peso,
                  age: state.edad,
                  laterality: state.laterality,
                  answers: state.extracted
                })
              }
            ]
          })
        });
        if (res.ok) {
          const data = await res.json();
          const parsed = JSON.parse(data.choices[0].message.content);
          return { ...fallbackPlan, ...parsed };
        }
      } catch (e) {}
      return fallbackPlan;
    }

    function sendAiResponse() {
      const input = document.getElementById('ai-chat-input');
      const val = (input?.value || '').trim();
      if (!val) return;

      appendChatMessageBubble('user', val);
      input.value = '';

      const questions = getAiInterviewQuestions();
      parseAndStoreAnswerByStep(state.chatStepIndex, val);

      state.chatStepIndex++;
      state.aiCompleted = true;
      document.getElementById('ai-incomplete-alert').classList.add('hidden');

      setTimeout(() => {
        if (state.chatStepIndex < questions.length) {
          const nextQ = questions[state.chatStepIndex];
          appendChatMessageBubble('ai', nextQ.text);
          renderQuickReplyChips(nextQ.chips);
        } else {
          renderQuickReplyChips([]);
          appendChatMessageBubble(
            'ai',
            `✅ **¡Entrevista de 7 puntos completada al 100%!** He registrado tu club (**${state.extracted.club || 'KINET'}**), tu ubicación (**${state.extracted.city || 'Lista'}**), tu perfil biomecánico y he programado las sesiones personalizadas de tu **Vestuario**. Pulsa abajo en **FINALIZAR CALIBRACIÓN & LANZAR KINET OS 🚀**.`
          );
        }
      }, 260);
    }

    function skipAiSetup() {
      state.aiCompleted = false;
      document.getElementById('ai-incomplete-alert').classList.remove('hidden');
      renderQuickReplyChips([]);
      appendChatMessageBubble(
        'ai',
        `⚡ Has saltado las preguntas restantes. Guardaremos las respuestas que ya hayas dado y el resto de casillas quedarán listas en **Mi Perfil** para cuando quieras rellenarlas.`
      );
    }

    // Finalizar Onboarding con guardado total en Perfil + Vestuario + Animación Sorpresa Reveal
    async function finishOnboarding() {
      const btn = document.getElementById('btn-finish-onboarding');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'CALIBRANDO MOTOR BIOMÉTRICO...';
      }

      state.altura = document.getElementById('slider-altura').value;
      state.peso = document.getElementById('slider-peso').value;
      state.edad = document.getElementById('slider-edad').value;
      const customSportIn = document.getElementById('custom-sport-input');
      if (customSportIn && customSportIn.value.trim()) {
        state.position = customSportIn.value.trim();
      }

      // 1. Generar el plan personalizado de Vestuario y Cuerpo Técnico IA (con las respuestas dadas)
      const aiPlan = await callOnboardingPersonalizationAPI();
      localStorage.setItem('kinet_ai_personalization_plan', JSON.stringify(aiPlan));
      localStorage.setItem('kinet_onboarding_chat_log', JSON.stringify(state.chatAnswers));

      // 2. Guardar Altura, Peso, Edad, Fecha, Posición y Lateralidad en las claves exactas de perfil.html
      const cleanH = `${state.altura} cm`;
      const cleanW = `${state.peso} kg`;
      localStorage.setItem('kinet_height', cleanH);
      localStorage.setItem('kinet_weight', cleanW);
      localStorage.setItem('kinet_user_anthropometry', `${cleanH} • ${cleanW}`);
      localStorage.setItem('kinet_age', String(state.edad));
      localStorage.setItem('kinet_age_years_direct', String(state.edad));
      if (state.birthdate) {
        localStorage.setItem('kinet_user_birthdate', state.birthdate);
      }
      localStorage.setItem('kinet_user_laterality', state.laterality);
      localStorage.setItem('kinet_sport', state.sport);
      localStorage.setItem('kinet_category', state.category);
      localStorage.setItem('kinet_user_category', state.category);
      localStorage.setItem('kinet_position', state.position);

      // 3. Guardar solo las respuestas del chat que el usuario haya contestado (si se lo saltó, no sobrescribe con vacíos)
      if (state.extracted.club) localStorage.setItem('kinet_user_club', state.extracted.club);
      if (state.extracted.city) localStorage.setItem('kinet_user_city', state.extracted.city);
      if (state.extracted.hometown) localStorage.setItem('kinet_user_hometown', state.extracted.hometown);
      if (state.extracted.transfermarktUrl) localStorage.setItem('kinet_user_transfermarkt', state.extracted.transfermarktUrl);
      if (state.extracted.videoUrl) localStorage.setItem('kinet_user_videolink', state.extracted.videoUrl);
      if (state.aiCompleted && aiPlan.bioHeadline) {
        localStorage.setItem('kinet_social_bio', aiPlan.bioHeadline);
      }

      // 4. Actualizar diccionario multi-perfil
      const profilesDB = JSON.parse(localStorage.getItem('kinet_profiles_db') || '{}');
      profilesDB.athlete = {
        ...(profilesDB.athlete || {}),
        roleType: 'athlete',
        roleName: 'Atleta Pro',
        name: localStorage.getItem('kinet_user_name') || 'Atleta KINET',
        sport: state.sport,
        category: state.category,
        position: state.position,
        height: cleanH,
        weight: cleanW,
        anthropometry: `${cleanH} • ${cleanW}`,
        laterality: state.laterality,
        edad: state.edad,
        birthdate: state.birthdate || localStorage.getItem('kinet_user_birthdate') || '',
        club: state.extracted.club || localStorage.getItem('kinet_user_club') || '',
        city: state.extracted.city || localStorage.getItem('kinet_user_city') || '',
        hometown: state.extracted.hometown || localStorage.getItem('kinet_user_hometown') || '',
        aiCompleted: state.aiCompleted,
        aiPlan: aiPlan,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem('kinet_profiles_db', JSON.stringify(profilesDB));

      localStorage.setItem('kinet_role', 'athlete');
      localStorage.setItem('kinet_active_role', 'athlete');
      localStorage.setItem('kinet_profile_completed', 'true');

      // Subir a Supabase si no es invitado
      if (localStorage.getItem('kinet_is_guest') !== 'true' && window.KinetBackend && typeof window.KinetBackend.pushLocalStateToCloud === 'function') {
        localStorage.setItem('kinet_logged_in', 'true');
        window.KinetBackend.pushLocalStateToCloud();
      }

      // 5. Lanzar la Animación Sorpresa Reveal antes de entrar al Vestuario
      const revealModal = document.getElementById('kinet-surprise-reveal-modal');
      if (revealModal) {
        document.getElementById('reveal-athlete-name').textContent = (localStorage.getItem('kinet_user_name') || 'ATLETA KINET').toUpperCase();
        document.getElementById('reveal-athlete-sub').textContent = `${state.sport.toUpperCase()} • ${state.position.toUpperCase()}`;
        document.getElementById('reveal-bio-stat').textContent = `${state.altura}cm • ${state.peso}kg`;
        document.getElementById('reveal-lat-stat').textContent = state.laterality;
        document.getElementById('reveal-cat-stat').textContent = state.extracted.club || state.category;
        document.getElementById('reveal-ai-directive').textContent = aiPlan.coachDirective;

        revealModal.classList.remove('hidden');
        const pBar = document.getElementById('reveal-progress-bar');
        const sTxt = document.getElementById('reveal-status-txt');
        setTimeout(() => { if (pBar) pBar.style.width = '65%'; }, 150);
        setTimeout(() => {
          if (pBar) pBar.style.width = '100%';
          if (sTxt) sTxt.textContent = '✓ PASAPORTE BIOMÉTRICO Y VESTUARIO LISTOS. ENTRANDO A KINET OS...';
        }, 1250);
        setTimeout(() => {
          window.location.href = `app.html?role=athlete&sport=${encodeURIComponent(state.sport)}`;
        }, 2350);
      } else {
        window.location.href = `app.html?role=athlete&sport=${encodeURIComponent(state.sport)}`;
      }
    }
  </script>
