<!DOCTYPE html>
<html lang="es" class="h-full bg-[#080A0C]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINET OS - Coach & Staff Calibration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { kinet: { neon: '#00FF66', titanium: '#0F1215', 'titanium-border': '#262D37' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Orbitron', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .bg-cyber-pattern { background-color: #080A0C; background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 60%); }
    .glass-card { background: rgba(19, 23, 29, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-cyber-pattern text-slate-100 font-sans min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div class="relative w-full max-w-3xl bg-[#0A0C0E] sm:rounded-[28px] border border-emerald-500/30 shadow-[0_0_80px_rgba(0,0,0,0.95)] p-6 space-y-6">
    
    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 text-black font-display font-black text-xl flex items-center justify-center shadow-[0_0_20px_rgba(16,185,129,0.4)]">
          C
        </div>
        <div>
          <h1 class="font-display font-black text-lg text-white">KINET OS • COACH SETUP</h1>
          <p class="text-[9px] text-emerald-400 font-mono tracking-widest uppercase">CONTROL DE PLANTILLA & TÁCTICA</p>
        </div>
      </div>
      <button onclick="window.location.href='index.html'" class="px-3 py-1 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-400 hover:text-white">Volver</button>
    </div>

    <div class="space-y-4">
      <h2 class="font-display font-bold text-sm text-emerald-400">1. CONFIGURACIÓN DEL CUERPO TÉCNICO</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="glass-card p-4 rounded-xl border border-slate-800 space-y-2">
          <label class="text-[10px] font-mono text-slate-400 uppercase">Categoría de la Plantilla</label>
          <select id="coach-category" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
            <option>Primer Equipo / Profesional</option>
            <option>Filial / Sub-21 / Cantera</option>
            <option>Fútbol Base / Juvenil</option>
            <option>Ligas Amateurs / Semiprofesional</option>
          </select>
        </div>
        <div class="glass-card p-4 rounded-xl border border-slate-800 space-y-2">
          <label class="text-[10px] font-mono text-slate-400 uppercase">Metodología Principal</label>
          <select id="coach-method" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
            <option>Periodización Táctica</option>
            <option>Modelo Híbrido / Físico-Táctico</option>
            <option>Alta Intensidad (Gegenpressing)</option>
            <option>Control de Cargas & Prevención de Lesiones</option>
          </select>
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl border border-slate-800 space-y-2">
        <label class="text-[10px] font-mono text-slate-400 uppercase">Nombre del Club o Equipo Técnico</label>
        <input type="text" id="coach-team-name" placeholder="Ej: KINET Athletic Club Staff" class="w-full bg-[#12161C] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
      </div>

      <button onclick="finishCoachOnboarding()" class="w-full py-3.5 rounded-xl bg-emerald-500 text-black font-display font-black text-xs tracking-wider uppercase hover:bg-emerald-400 transition shadow-[0_0_20px_rgba(16,185,129,0.3)]">
        INICIAR PANEL DE ENTRENADOR & STAFF 🚀
      </button>
    </div>

  </div>

  <script>
    lucide.createIcons();
    function finishCoachOnboarding() {
      localStorage.setItem('kinet_role', 'Entrenador / Staff');
      localStorage.setItem('kinet_coach_category', document.getElementById('coach-category').value);
      localStorage.setItem('kinet_coach_method', document.getElementById('coach-method').value);
      localStorage.setItem('kinet_team_name', document.getElementById('coach-team-name').value || 'Staff Técnico KINET');
      localStorage.setItem('kinet_profile_completed', 'true');
      window.location.href = 'fase1.html';
    }
  </script>
</body>
</html>
