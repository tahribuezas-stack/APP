<title>Tutorial interactivo · KINET OS</title>
<meta name="description" content="Tutorial de KINET OS: aprende a usar tu KINET Card, el analizador táctico, los agentes de IA y la comunidad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080E;--panel:rgba(12,16,24,.92);--line:rgba(255,255,255,.1);--fg:#E5E7EB;--mute:#94A3B8;--acc:#00FF88;--acc-rgb:0,255,136}
body[data-role="staff"]{--acc:#F59E0B;--acc-rgb:245,158,11}
body[data-role="scout"]{--acc:#3B82F6;--acc-rgb:59,130,246}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 500px at 20% -10%,rgba(var(--acc-rgb),.08),transparent 60%),var(--bg)}
button{font-family:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace}
.orb{font-family:Orbitron,Inter,sans-serif}

/* barra superior */
.top{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:rgba(6,8,14,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.demo-badge{font:700 .62rem 'JetBrains Mono',monospace;letter-spacing:.08em;color:#04060A;background:var(--acc);border-radius:999px;padding:4px 10px}
.top h1{font:900 .95rem Orbitron,sans-serif;margin:0;letter-spacing:.04em}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--mute);padding:6px 12px;font:600 .68rem Inter,sans-serif}
.seg button.on{background:rgba(var(--acc-rgb),.16);color:var(--acc)}
.btn{background:rgba(var(--acc-rgb),.12);border:1px solid rgba(var(--acc-rgb),.45);color:var(--acc);border-radius:10px;padding:7px 12px;font:700 .7rem Inter,sans-serif;text-decoration:none;display:inline-block}
.btn.solid{background:var(--acc);color:#04060A;border-color:var(--acc)}

/* estructura */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;gap:14px;padding:14px 16px;max-width:1500px;margin:0 auto}
.side{display:flex;flex-direction:column;gap:7px;position:sticky;top:64px;align-self:start}
.side button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:11px 12px;font:600 .8rem Inter,sans-serif;transition:all .15s}
.side button:hover{border-color:rgba(var(--acc-rgb),.5)}
.side button.on{border-color:var(--acc);background:rgba(var(--acc-rgb),.1);color:var(--acc)}
.side .sep{height:1px;background:var(--line);margin:4px 0}
.screen{background:rgba(8,11,17,.8);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:600px;position:relative}
.screen-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.screen-head h2{font:900 1.05rem Orbitron,sans-serif;margin:2px 0 0}
.tag{font:700 .58rem 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--acc)}
.tour{display:flex;gap:6px;align-items:center}
.info{position:sticky;top:64px;align-self:start;background:var(--panel);border:1px solid rgba(var(--acc-rgb),.4);border-radius:18px;padding:16px;max-height:calc(100vh - 84px);overflow:auto}
.info h3{font:900 .95rem Orbitron,sans-serif;margin:6px 0 10px}
.info .lbl{font:700 .58rem 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--acc);margin:12px 0 4px}
.info p{margin:0;font-size:.82rem;line-height:1.5;color:#CBD5E1}
.info ol{margin:0;padding-left:18px;font-size:.82rem;line-height:1.5;color:#CBD5E1}
.info li{margin-bottom:3px}
.note{margin-top:12px;border:1px dashed rgba(var(--acc-rgb),.5);border-radius:10px;padding:8px 10px;font-size:.74rem;color:#CBD5E1}
.close-sheet{display:none}

/* marco con la pantalla real */
.frame-wrap{position:relative;height:calc(100vh - 230px);min-height:520px;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#04060A}
#frame{border:0;transform-origin:0 0;display:block;background:#04060A}
.screen{padding:14px}
/* elementos simulados (no funcionales) */
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.p{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.p-t{font:700 .6rem 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--acc);margin-bottom:8px;display:block}
[data-tip]{cursor:pointer;transition:box-shadow .15s,border-color .15s,background .15s;position:relative}
[data-tip]:hover{box-shadow:0 0 0 2px rgba(var(--acc-rgb),.55)}
[data-tip].sel{box-shadow:0 0 0 2px var(--acc),0 0 18px rgba(var(--acc-rgb),.35)}
.hint{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--mute);margin-bottom:12px}
.hint i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pl 1.4s infinite}
@keyframes pl{0%,100%{opacity:.3}50%{opacity:1}}
.mb{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 11px;font:600 .72rem Inter,sans-serif;display:inline-flex;align-items:center;gap:6px}
.mb.pri{background:var(--acc);color:#04060A;border-color:var(--acc)}
.mb.lock{opacity:.7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font:700 .6rem 'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:#CBD5E1;background:rgba(255,255,255,.03)}
.pill.on{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.1)}
.field{background:#04060A;border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:8px 10px;font-size:.74rem;color:#94A3B8}
.bub{max-width:82%;padding:9px 12px;border-radius:12px;font-size:.76rem;line-height:1.45}
.bub.in{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#CBD5E1;border-top-left-radius:4px}
.bub.out{background:rgba(var(--acc-rgb),.16);border:1px solid rgba(var(--acc-rgb),.45);color:#fff;margin-left:auto;border-top-right-radius:4px}
.card3d{width:150px;aspect-ratio:3/4.2;border-radius:14px;background:linear-gradient(160deg,rgba(var(--acc-rgb),.35),rgba(10,14,22,.95) 70%);border:2px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:0 auto}
.card3d b{font:900 2rem Orbitron,sans-serif}
.stat{display:flex;justify-content:space-between;font:700 .64rem 'JetBrains Mono',monospace;color:#CBD5E1;width:80%}
.pitch{aspect-ratio:16/9;border-radius:12px;background:repeating-linear-gradient(90deg,#0d3a22 0 8%,#0f4428 8% 16%);border:2px solid rgba(255,255,255,.25);position:relative}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid #04060A;transform:translate(-50%,-50%)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font:600 .66rem 'JetBrains Mono',monospace;color:#94A3B8}
.cal span.has{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.1)}
.post-av{width:34px;height:34px;border-radius:50%;background:rgba(var(--acc-rgb),.2);border:1px solid var(--acc);display:flex;align-items:center;justify-content:center;font:900 .7rem Orbitron,sans-serif;color:var(--acc)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.tpl{min-width:140px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.7rem}
.tpl span{display:block;font:700 .5rem 'JetBrains Mono',monospace;color:var(--mute);margin-top:2px}

@media (max-width:1100px){.shell{grid-template-columns:200px minmax(0,1fr)}.info{position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:46vh;z-index:40;transform:translateY(130%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.6)}.info.open{transform:none}.close-sheet{display:inline-block;float:right;background:none;border:0;color:#fff;font-size:1.1rem}}
@media (max-width:760px){.grid{grid-template-columns:1fr !important}.shell{grid-template-columns:minmax(0,1fr);padding:10px}.side,.screen,.info{min-width:0;max-width:100%}.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.side button{white-space:nowrap;flex:0 0 auto}.side .sep{display:none}.g2,.g3{grid-template-columns:1fr}.screen{padding:12px}}
</style>

<div class="top">

  <h1>Tutorial de KINET OS</h1>
  <span class="sp"></span>
  <div class="seg" id="roleSeg" title="Ver la app según tu rol">
    <button data-r="athlete" class="on">Atleta</button><button data-r="staff">Staff</button><button data-r="scout">Ojeador</button>
  </div>

</div>

<script>
/* =====================================================================
   TUTORIAL INTERACTIVO — réplica NO funcional de la interfaz de KINET OS.
   Pulsa cualquier elemento (botones, tarjetas, pestañas…) y aparece una explicación:
   qué es, cómo se usa y para qué sirve. Nada de lo que veas aquí guarda datos ni gasta IA.
   ===================================================================== */
const ROLE_NAMES = { athlete: 'Atleta', staff: 'Entrenador / Staff', scout: 'Ojeador / Director deportivo' };

/* ---------- TEXTOS DE AYUDA: id → { t: título, w: qué es, h: [pasos], p: para qué sirve, n: nota, r: {rol: nota} } ---------- */
const TIPS = {
/* ===== VESTUARIO ===== */
'v-estado': { t: 'Estado físico y disponibilidad de hoy', w: 'Tu parte diario de forma: cómo llegas hoy a entrenar o competir.', h: ['Pulsa «Check-in» al empezar el día.', 'Indica cómo te sientes (energía, sueño, dolores).', 'La app guarda el registro y lo comparte con tu Cuerpo Técnico IA.'], p: 'Así las recomendaciones de la IA y tus cargas de entrenamiento parten de cómo estás de verdad, no de un plan genérico.' },
'v-checkin': { t: 'Check-in', w: 'Botón para registrar tu estado de hoy en menos de 30 segundos.', h: ['Pulsa Check-in.', 'Rellena las preguntas rápidas.', 'Guarda: el consejo del día se actualiza.'], p: 'Un historial diario permite detectar sobrecargas y mejorar antes de lesionarte.' },
'v-consejo': { t: 'Consejo directo del Cuerpo Técnico IA', w: 'Una recomendación corta y concreta para hoy, generada con tus datos.', h: ['Léelo al abrir el Vestuario.', '«↻ Cambiar» pide otro consejo.', '«Completar» lo marca como hecho.'], p: 'Convierte tus datos en una acción clara del día, sin tener que abrir el chat.', n: 'Cambiar el consejo gasta una consulta de tu cupo diario de IA.' },
'v-cal': { t: 'Calendario / Ajustar', w: 'Tu calendario de entrenamientos y partidos. Empieza vacío: solo aparece lo que programes tú o lo que programe la IA.', h: ['Pulsa «Calendario / Ajustar» para ver el mes.', 'Toca un día para ver sus sesiones.', 'Añade, edita o borra sesiones; márcalas como hechas.'], p: 'Organiza tu semana y deja que el Cuerpo Técnico IA tenga en cuenta tus cargas reales.' },
'v-prog': { t: 'Programar (manual)', w: 'Crea tú mismo una sesión: día, hora, tipo y título.', h: ['Pulsa «＋ Programar».', 'Elige día, hora y tipo (fuerza, técnica, partido, descanso…).', 'Guarda: aparece en el calendario y en «Sesiones de hoy» si es hoy.'], p: 'Control total: tú decides qué hay en tu agenda.' },
'v-ia': { t: 'Programar con IA', w: 'La IA propone una semana completa según tu deporte, posición, estado y objetivo.', h: ['Pulsa «🤖 Programar con IA».', 'Revisa la propuesta que aparece en un aviso.', 'Acéptala entera o descártala; puedes editar cualquier sesión después.'], p: 'Ahorra tiempo planificando y adapta la carga a tu momento de forma.', n: 'Nada se añade al calendario sin que tú aceptes la propuesta. Gasta una consulta de IA.' },
'v-energia': { t: 'A tope · Normal · Cargado', w: 'Selector rápido de cómo llegas hoy: con energía, normal o cargado de fatiga.', h: ['Toca el estado que mejor te describe.', 'La IA ajusta intensidad y recomendaciones del día.'], p: 'Dos segundos de información que evitan entrenar a ciegas.' },
'v-sesiones': { t: 'Sesiones de hoy', w: 'Lista de lo programado para hoy.', h: ['Aparece solo lo que programaste tú o aceptaste de la IA.', 'Marca cada sesión como hecha al terminar.'], p: 'Tu hoja de ruta del día; si está vacía es porque no hay nada programado.' },
'v-chat': { t: 'Línea directa con tu Cuerpo Técnico IA', w: 'Acceso rápido al chat de los especialistas con consultas frecuentes ya preparadas.', h: ['Toca un atajo (por ejemplo «Sobrecarga isquios»).', 'Se abre el Cuerpo Técnico con la consulta escrita.', 'O pulsa «Ir →» para entrar sin pregunta.'], p: 'Llegar a la respuesta con un toque.' },
/* ===== CUERPO TÉCNICO ===== */
'c-junta': { t: 'Sala de Juntas', w: 'Los 4 especialistas IA (físico y nutrición, psicología, técnico y vídeo, carrera y marketing) trabajando juntos.', h: ['Elige «Sala de Juntas» para consultas que cruzan varias áreas.', 'O elige un especialista para una duda concreta.', 'Escribe tu consulta como se la dirías a un profesional.'], p: 'Respuestas de nivel profesional que conocen tu perfil, tu deporte y tu momento.', r: { staff: 'Como Staff, las respuestas se orientan a gestionar plantilla, cargas del grupo y planificación.', scout: 'Como Ojeador, se orientan a evaluación de talento, informes y mercado.' } },
'c-especialista': { t: 'Especialistas', w: 'Cada pestaña es un experto distinto con su propia memoria de la conversación.', h: ['Toca el especialista que necesitas.', 'Lo que cuentes a uno lo conocen los demás (memoria compartida).'], p: 'No repetir tus datos: todos trabajan con tu expediente.' },
'c-motor': { t: 'API IA (solo equipo)', w: 'Ajustes técnicos de las claves de IA. Solo lo ve el equipo de KINET; los usuarios no necesitan configurar nada.', h: ['Los usuarios simplemente escriben en el chat.', 'Si la IA no está disponible, verás un aviso claro y podrás reintentarlo.'], p: 'Que la IA funcione sin que tengas que tocar claves.', n: 'Tus consultas diarias dependen de tu plan.' },
'c-rutina': { t: 'Generar rutina / plantilla', w: 'Convierte la rutina o el plan que te dio tu especialista en una plantilla con el sello KINET para descargar en imagen o PDF. Si aún no tienes ninguno, el especialista te entrevista primero.', h: ['Pide una rutina en el chat; el especialista te hará unas preguntas (objetivo, fase de la temporada, días, material, molestias).', 'Cuando te entregue el plan, pulsa «📋 Generar Rutina / Plantilla» o «Convertir en Plantilla».', 'Descarga la plantilla en PNG o PDF.'], p: 'Pasas de hablar a tener un plan específico para tu deporte y tu puesto, listo para ejecutar y compartir con tu entrenador.', n: 'Si pides algo que va contra tu objetivo (p. ej. hipertrofia de culturista siendo futbolista), el especialista te lo explicará y te propondrá la alternativa.' },
'c-pdf': { t: 'Exportar informe PDF', w: 'Descarga la conversación o el acta de la Sala de Juntas en PDF.', h: ['Pulsa «📄 Exportar Informe PDF».', 'Se descarga un documento ordenado y listo para compartir.'], p: 'Para entregar a tu entrenador, club o guardarlo.' },
'c-atajos': { t: 'Atajos de consulta', w: 'Preguntas frecuentes ya redactadas.', h: ['Toca un atajo.', 'Se envía como si lo hubieras escrito.'], p: 'Empezar rápido con las dudas más habituales.' },
'c-adjuntar': { t: 'Adjuntar imagen', w: 'Sube una foto (técnica, postura, análisis, comida) para que la IA la tenga en cuenta.', h: ['Pulsa 🖼️.', 'Elige la imagen.', 'Escribe qué quieres saber y envía.'], p: 'La IA responde sobre algo que ve, no solo sobre lo que cuentas.' },
'c-cupo': { t: 'Tu cupo de consultas', w: 'Medidor «IA HOY» encima de la caja de texto (y tarjeta «Uso de IA» en la barra lateral): pulsa para ver el detalle de potente, básico, asistentes, imágenes y vídeo. El plan gratuito incluye 8 al día (motor básico); al agotarlas verás una cuenta atrás hasta las 00:00 h. Pro (50/día, 15 con el motor potente) y Club (125/día, 45 con el potente) tienen cupos más amplios.', h: ['Mira el contador junto al chat.', 'Se reinicia cada día a las 00:00 h (con cuenta atrás visible).'], p: 'Probar la IA potente gratis y mejorar de plan solo si la necesitas.', n: 'En Pro y Club, el uso de IA potente tiene también un tope mensual; al agotarse la IA sigue con el motor básico.' },
'c-input': { t: 'Escribe tu consulta', w: 'Campo de mensaje. Responde como un profesional: breve, concreto y sin información que no pediste.', h: ['Escribe con tus palabras.', 'Pulsa Enter o la flecha para enviar.'], p: 'Cuanto más concreta la pregunta, más útil la respuesta.' },
/* ===== FICHA ===== */
'f-carta': { t: 'Carta KINET interactiva', w: 'Tu carta de jugador con 6 atributos y una nota global (GRL). Muestra «??» hasta que esté calibrada.', h: ['Pasa el cursor (o desliza en móvil) para verla en 3D.', 'Elige el nivel de carta: Bronce, Plata, Oro 24K, Holo Élite.'], p: 'Tu identidad de rendimiento, lista para compartir.' },
'f-nivel': { t: 'Nivel de carta', w: 'Diseño de la carta según tu GRL: Bronce, Plata, Oro 24K y Holo Élite.', h: ['Toca un nivel para previsualizarlo.'], p: 'Solo cambia el aspecto; los niveles superiores se alcanzan con mejor rendimiento verificado.' },
'f-descubrir': { t: 'Descubrir tu KINET Card (auditoría IA)', w: 'La IA calcula tus atributos a partir de 3 micro-clips de tu posición. Tarda ~1,5 min.', h: ['Pulsa el botón.', 'Sube los 3 clips que pide para tu deporte y posición.', 'La IA devuelve tus 6 atributos y tu GRL.'], p: 'Carta verificada con IA (sello AI Verified) frente a la manual.', n: 'Consume minutos de vídeo de tu plan (Pro/Club) o de tus bonos.' },
'f-pdf-carta': { t: 'Descargar carta en PDF', w: 'Tu carta lista para imprimir o enviar.', h: ['Pulsa «Descargar Carta PDF».'], p: 'Para tu dossier o redes.' },
'f-cv': { t: 'Exportar CV + informe PDF', w: 'Tu CV deportivo profesional (con foto y datos) junto a tu informe de tendencias.', h: ['Pulsa «Exportar CV + Informe PDF».', 'Se abre una vista lista para guardar como PDF.'], p: 'Un documento serio para clubes y ojeadores.' },
'f-audit': { t: 'Auditoría biomecánica IA', w: 'Edición manual de atributos bloqueada hasta que verifiques tu carta, para que los valores sean fiables.', h: ['Pulsa «Descubrir ahora».', 'Completa la auditoría con tus clips.'], p: 'Garantiza que los datos que ve un ojeador no están inflados.', n: 'Este bloqueo es intencionado.' },
'f-informe': { t: 'Informe completo de tendencias', w: 'Evolución de tus métricas y puntos de mejora según la IA.', h: ['Despliega el informe.', 'Pulsa «Ver requisitos de vídeo» para saber qué grabar en tu deporte y posición.'], p: 'Saber en qué mejorar y cómo grabarlo bien.' },
/* ===== LABORATORIO VÍDEO ===== */
'l-subir': { t: 'Subir vídeo a Vision IA', w: 'La IA analiza un clip a partir de fotogramas clave. El vídeo no se guarda en servidores.', h: ['Pulsa «Subir Vídeo a Vision IA».', 'Elige un clip de tu deporte.', 'Espera el análisis y revisa las métricas.'], p: 'Feedback técnico objetivo de tus jugadas.', n: 'Gasta minutos de vídeo de tu plan o bonos.', r: { scout: 'Como Ojeador, úsalo para evaluar clips de jugadores que sigues.' } },
'l-resultados': { t: 'Resultados y métricas del clip', w: 'Lectura de la IA sobre técnica, movimientos y puntos a corregir.', h: ['Revisa cada métrica.', 'Compara con tus sesiones anteriores.'], p: 'Detectar fallos y confirmar mejoras.' },
'l-sesiones': { t: 'Sesiones auditadas recientemente', w: 'Historial de tus últimos análisis.', h: ['Toca una sesión para reabrirla.'], p: 'Ver tu progreso en el tiempo.' },
'l-guardar': { t: 'Guardar en Analizador y Pizarra 3D', w: 'Envía el resultado al Analizador para usarlo en tu plantilla o estrategia.', h: ['Pulsa el botón al terminar un análisis.'], p: 'Conecta el vídeo con la planificación táctica.' },
'l-pdf': { t: 'Exportar informe PDF', w: 'Informe del análisis para compartir.', h: ['Pulsa «Exportar Informe PDF».'], p: 'Entregar pruebas objetivas a tu club o a un ojeador.' },

function labelOf(n) {
  if (!n || n.nodeType !== 1) return '';
  const own = n.getAttribute('aria-label') || n.getAttribute('title') || n.getAttribute('placeholder') || '';
  let t = (n.innerText || n.textContent || '').replace(/\s+/g, ' ').trim();
  if (t.length > 110) { const h = n.querySelector('.panel-label,.panel-head,h1,h2,h3,h4,legend,label'); t = h ? (h.innerText || '').replace(/\s+/g, ' ').trim() : ''; }
  return (own + ' ' + t).trim();
}
function tipFor(el) {
  const pre = SCREENS[current].pre;
  const ids = Object.keys(KEYS).filter(k => k[0] === pre && TIPS[k]);
  let n = el, hops = 0;
  while (n && n.nodeType === 1 && n.tagName !== 'BODY' && hops++ < 9) {
    const lb = labelOf(n);
    if (lb) { const id = ids.find(k => KEYS[k].test(lb)); if (id) return { id, el: n }; }
    n = n.parentElement;
  }
  return null;
}
function findEl(doc, id) {
  const re = KEYS[id]; if (!re) return null;
  const cands = doc.querySelectorAll('button, a, label, input, textarea, select, [onclick], .panel-label, .pill, .chip, h1, h2, h3, h4, .kinet-panel');
  for (const n of cands) {
    const r = n.getBoundingClientRect(); if (r.width < 6 || r.height < 6) continue;
    const cs = doc.defaultView.getComputedStyle(n); if (cs.visibility === 'hidden' || cs.display === 'none') continue;
    const lb = labelOf(n); if (lb && lb.length < 140 && re.test(lb)) return n;
  }
  return null;
}

  const wrap = $('#frameWrap'), f = $('#frame'); if (!wrap || !f) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  frameScale = w >= 1000 ? w / 1280 : 1;
  f.style.width = (frameScale === 1 ? w : 1280) + 'px';
  f.style.height = (h / frameScale) + 'px';
  f.style.transform = frameScale === 1 ? 'none' : `scale(${frameScale})`;
}

const FRAME_CSS = `.kx-tut-sel{outline:2px solid #00FF88 !important;outline-offset:2px;box-shadow:0 0 22px rgba(0,255,136,.45) !important;border-radius:10px}
.kx-tut-hover{outline:2px dashed rgba(0,255,136,.7) !important;outline-offset:2px}
*{cursor:help !important} ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}`;

function armFrame() {
  const f = $('#frame'), doc = frameDoc(), win = f && f.contentWindow; if (!doc || !win) return;
  try {
    const st = doc.createElement('style'); st.textContent = FRAME_CSS; doc.head.appendChild(st);
    win.open = () => null; win.alert = () => {}; win.confirm = () => false; win.prompt = () => null;
    const stop = (e) => { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation && e.stopImmediatePropagation(); };
    ['mousedown', 'mouseup', 'pointerdown', 'pointerup', 'touchstart', 'touchend', 'auxclick', 'contextmenu', 'submit', 'dblclick', 'dragstart'].forEach(ev => doc.addEventListener(ev, stop, true));
    doc.addEventListener('keydown', (e) => { if (['Enter', ' ', 'Tab'].includes(e.key)) stop(e); }, true);
    doc.addEventListener('click', (e) => {
      stop(e);
      const hit = tipFor(e.target);
      if (hit) showTip(hit.id, hit.el); else showGeneric(e.target);
    }, true);
    let last = null;
    doc.addEventListener('mouseover', (e) => { if (last) last.classList.remove('kx-tut-hover'); const h = tipFor(e.target); last = h ? h.el : null; if (last && !last.classList.contains('kx-tut-sel')) last.classList.add('kx-tut-hover'); }, true);
    // sin modales ni avisos de bienvenida encima de la pantalla
    setTimeout(() => { doc.querySelectorAll('.kinet-modal-overlay.open').forEach(m => m.classList.remove('open')); }, 600);
  } catch (e) { console.warn('tutorial: no se pudo preparar la pantalla', e); }
  buildTour();
}
function buildTour() {
  const doc = frameDoc(); if (!doc) return;
  const pre = SCREENS[current].pre;
  tourList = Object.keys(KEYS).filter(k => k[0] === pre && TIPS[k] && findEl(doc, k));
  tourIdx = -1;
  $('#tourGo').textContent = tourList.length ? '▶ Visita guiada' : '▶ Visita guiada';
}
function clearSel() { const d = frameDoc(); if (d) d.querySelectorAll('.kx-tut-sel').forEach(e => e.classList.remove('kx-tut-sel')); }

function loadScreen() {
  const s = SCREENS[current];
  const role = document.body.dataset.role;
  try { localStorage.setItem('kinet_active_role', role); localStorage.setItem('kinet_role', role); } catch (e) {}
  $('#screen').innerHTML = `
    <div class="screen-head"><div><span class="tag">PANTALLA REAL · ${esc(ROLE_NAMES[role].toUpperCase())}</span><h2>${esc(s.title)}</h2></div>
      <div class="tour"><button class="btn" type="button" id="tourPrev" style="display:none">‹</button><button class="btn solid" type="button" id="tourGo">▶ Visita guiada</button><button class="btn" type="button" id="tourNext" style="display:none">›</button></div></div>
    <div class="hint"><i></i><span>Estás viendo la <b>pantalla real</b> de KINET OS. <b>Toca cualquier botón, tarjeta o campo</b> y te explico qué hace, cómo se usa y para qué sirve. Aquí nada se guarda, no gasta IA ni te cobra.</span></div>
    <div id="frameWrap" class="frame-wrap"><iframe id="frame" title="${esc(s.name)}" src="${s.page}?tutorial=1&role=${role}" loading="eager"></iframe></div>`;
  tourList = []; tourIdx = -1; selectedId = null;
  layoutFrame();
  $('#frame').addEventListener('load', () => { layoutFrame(); armFrame(); setTimeout(buildTour, 1200); });
  showWelcome();
}

function showWelcome() {
  $('#info').innerHTML = `<button class="close-sheet" type="button" data-close>✕</button><span class="tag">QUÉ HAGO AQUÍ</span><h3>${esc(SCREENS[current].name)}</h3>
    <p>Pulsa cualquier elemento de la pantalla para ver su explicación. También puedes usar la <b>visita guiada</b> (▶) para recorrerlos en orden.</p>
    <div class="note">Es la app de verdad, con tus datos, pero en modo demostración: nada de lo que pulses se ejecuta.</div>`;
  $('#info').classList.remove('open');
}
function showGeneric(el) {
  const lb = labelOf(el).slice(0, 80);
  clearSel();
  $('#info').innerHTML = `<button class="close-sheet" type="button" data-close>✕</button><span class="tag">${esc(SCREENS[current].name.toUpperCase())}</span><h3>${esc(lb || 'Elemento de la pantalla')}</h3>
    <p>Este elemento forma parte de la pantalla real de ${esc(SCREENS[current].name)}. Prueba a pulsar sus botones principales o usa la <b>visita guiada</b> (▶) para ver los más importantes explicados paso a paso.</p>`;
  $('#info').classList.add('open');
}
function showTip(id, el) {
  const t = TIPS[id]; if (!t) return;
  selectedId = id;
  clearSel();
  const d = frameDoc(); const target = el || (d && findEl(d, id)); if (target) target.classList.add('kx-tut-sel');
  const role = document.body.dataset.role;
  const rn = t.r && t.r[role];
  $('#info').innerHTML = `<button class="close-sheet" type="button" data-close>✕</button><span class="tag">${esc(SCREENS[current].name.toUpperCase())}</span><h3>${esc(t.t)}</h3>
    <div class="lbl">QUÉ ES</div><p>${esc(t.w)}</p>
    <div class="lbl">CÓMO SE USA</div><ol>${t.h.map(h => `<li>${esc(h)}</li>`).join('')}</ol>
    <div class="lbl">PARA QUÉ SIRVE</div><p>${esc(t.p)}</p>
    ${t.n ? `<div class="note">${esc(t.n)}</div>` : ''}${rn ? `<div class="note"><b>${esc(ROLE_NAMES[role])}:</b> ${esc(rn)}</div>` : ''}`;
  $('#info').classList.add('open');
  const i = tourList.indexOf(id); if (i >= 0) tourIdx = i;
}
function tourStep(d) {
  if (!tourList.length) { buildTour(); if (!tourList.length) return; }
  tourIdx = d === 0 ? 0 : (tourIdx + d + tourList.length) % tourList.length;
  const id = tourList[tourIdx], doc = frameDoc(), el = doc && findEl(doc, id);
  showTip(id, el);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('#tourPrev').style.display = $('#tourNext').style.display = 'inline-block';
  $('#tourGo').textContent = `${tourIdx + 1} / ${tourList.length}`;
}

document.addEventListener('click', (e) => {
  const sb = e.target.closest('#side button[data-s]');
  if (sb) { current = sb.dataset.s; renderSide(); loadScreen(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (e.target.closest('[data-close]')) { $('#info').classList.remove('open'); return; }
  if (e.target.closest('#tourGo')) { tourStep(tourIdx < 0 ? 0 : 1); return; }
  if (e.target.closest('#tourPrev')) { tourStep(-1); return; }
  if (e.target.closest('#tourNext')) { tourStep(1); return; }
  const rb = e.target.closest('#roleSeg button');
  if (rb) {
    document.body.dataset.role = rb.dataset.r;
    document.querySelectorAll('#roleSeg button').forEach(b => b.classList.toggle('on', b === rb));
    loadScreen(); return;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') tourStep(1); if (e.key === 'ArrowLeft') tourStep(-1); if (e.key === 'Escape') $('#info').classList.remove('open'); });
window.addEventListener('resize', layoutFrame);

try { const r = localStorage.getItem('kinet_active_role'); if (['athlete', 'staff', 'scout'].includes(r)) { document.body.dataset.role = r; document.querySelectorAll('#roleSeg button').forEach(b => b.classList.toggle('on', b.dataset.r === r)); } } catch (e) {}
renderSide(); loadScreen();
</script>
</body>
</html>
