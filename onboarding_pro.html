<!DOCTYPE html>
<html lang="es" class="h-full bg-[#080A0C]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINET OS - Multi-Sport Precision Calibration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { kinet: { neon: '#00FF66', titanium: '#0F1215' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Orbitron', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .bg-cyber-pattern { background-color: #080A0C; background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.12) 0%, transparent 60%); }
    .glass-card { background: rgba(19, 23, 29, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
    input[type=range] { -webkit-appearance: none; background: #181C22; border-radius: 8px; height: 6px; border: 1px solid #262D37; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #00FF66; cursor: pointer; }
  </style>
</head>
<body class="bg-cyber-pattern text-slate-100 font-sans min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div class="relative w-full max-w-3xl h-auto max-h-[92vh] bg-[#0A0C0E] sm:rounded-[28px] border border-slate-800 p-4 sm:p-6 flex flex-col justify-between space-y-4 overflow-y-auto">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-kinet-neon text-black font-display font-black text-lg flex items-center justify-center">K</div>
        <h1 class="font-display font-black text-base text-white">KINET OS</h1>
      </div>
      <div class="px-2.5 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-[9px] font-mono text-slate-400">
        PASO <span id="step-num" class="text-kinet-neon font-bold">02</span> / 06
      </div>
    </div>

    <!-- PASO 2: DEPORTE -->
    <div id="step-2" class="space-y-4 my-auto">
      <h2 class="font-display font-bold text-sm sm:text-lg text-white">2. SELECCIONA TU DEPORTE</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <div onclick="selectSport('Fútbol')" id="sport-futbol" class="glass-card p-3.5 rounded-xl border-2 border-kinet-neon cursor-pointer text-center">⚽ Fútbol</div>
        <div onclick="selectSport('Baloncesto')" id="sport-baloncesto" class="glass-card p-3.5 rounded-xl border-2 border-slate-800 cursor-pointer text-center">🏀 Baloncesto</div>
        <div onclick="selectSport('Pádel / Tenis')" id="sport-padel" class="glass-card p-3.5 rounded-xl border-2 border-slate-800 cursor-pointer text-center">🎾 Pádel</div>
      </div>
      <button onclick="nextStep(5)" class="w-full py-3 rounded-xl bg-kinet-neon text-black font-display font-bold text-xs uppercase">CONTINUAR A BIOMETRÍA</button>
    </div>

    <!-- PASO 5: BIOMETRÍA -->
    <div id="step-5" class="space-y-4 my-auto hidden">
      <h2 class="font-display font-bold text-sm sm:text-lg text-white">5. PARÁMETROS BIOMÉTRICOS</h2>
      <div class="space-y-3">
        <input type="range" id="slider-altura" min="100" max="220" value="178" class="w-full">
      </div>
      <button onclick="finishOnboarding()" class="w-full py-3 rounded-xl bg-kinet-neon text-black font-display font-bold text-xs uppercase">FINALIZAR CALIBRACIÓN</button>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let state = { sport: 'Fútbol' };
    function nextStep(stepNum) {
      document.getElementById('step-num').textContent = "0" + stepNum;
      document.getElementById('step-2').classList.toggle('hidden', stepNum !== 2);
      document.getElementById('step-5').classList.toggle('hidden', stepNum !== 5);
    }
    function selectSport(val) { state.sport = val; }
    function finishOnboarding() {
      window.location.href = 'fase1.html';
    }
  </script>
</body>
</html>
